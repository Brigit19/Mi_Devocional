<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Devocional - Casa Apostólica Belén</title>
  <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Mi Devocional&quot;,&quot;short_name&quot;:&quot;Devocional&quot;,&quot;start_url&quot;:&quot;./&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#FDF5F8&quot;,&quot;theme_color&quot;:&quot;#93547A&quot;}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #93547A;
      --secondary: #EFB8D2;
      --accent: #D9B368;
      --bg: #FDF5F8;
      --text: #2c2c2c;
      --border: #F3E1EB;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    #app { width: 100%; height: 100vh; }
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, var(--primary) 0%, #c997ba 100%);
      padding: 20px;
    }
    .login-box {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    .login-box h1 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .login-box p {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(147,84,122,0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #7a4461; }
    .role-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .role-buttons button {
      flex: 1;
    }
    .error { color: #d32f2f; font-size: 14px; margin-top: 10px; text-align: center; }
    .loading { text-align: center; padding: 40px; color: var(--primary); }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-container">
      <div class="login-box">
        <h1>🌸 Mi Devocional</h1>
        <p>Casa Apostólica Belén</p>
        <div id="content"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",
      authDomain: "mi-devocional-663d3.firebaseapp.com",
      projectId: "mi-devocional-663d3",
      storageBucket: "mi-devocional-663d3.firebasestorage.app",
      messagingSenderId: "338063743895",
      appId: "1:338063743895:web:1578e6298f0d8b2b3982d2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DEFAULT_NAMES = [
      "Arianna Nicolle Rojas Camasca", "Danitza Belen Cordero Mercado", "Estefany Collazos", "Juana Huayanay Loayza",
      "Lady Berrospi", "María Angela Vasquez Nolasco", "Marjorie Villalba Salazar", "Marisol Justiniano Tinoco",
      "Marlú Milagros Escobar Salazar", "Sarai Tania Palomino", "Yorleni Collazos Castro", "Isabel Nancy Luna Vasquez",
      "Katherin Yocelinda Meza Alanya", "Camila Rubino", "Erika Minaya Tolentino", "Belen Porras Blanco",
      "Vania Noemi Canchanya Tinoco", "Yamile Mireya Inga Baldeon", "Nayra Stefania Gutierrez Flores", "Heidy Rojas Ahuanari",
      "Zayuri Esteban Laura", "Thania Alegre Castillo", "Pamela Ines Carhuallanqui Obregón", "Maria Fernanda Tinoco Palacios",
      "Valery Zulay Ipurre Escalera", "Ruth Keren Ramos Mayta", "Anny Karen Sotacuro Quicha", "Lucero Isidro Castro",
      "Alcira Sanchez Quispe", "Andrea Jasmin Flores Santamaria", "Iyari Lazaro", "Marilyn Rosa Huayanay Torres",
      "Very Luz Condezo Baltazar", "Anahi Anette Alvarez Collahuacho", "Laura Sanchez Quispe", "Nicole Huaranga Reyes"
    ];

    const content = document.getElementById('content');

    async function init() {
      console.log('🚀 Inicializando...');
      showRole();
    }

    function showRole() {
      content.innerHTML = `
        <p style="text-align: center; margin-bottom: 20px;">¿Quién eres?</p>
        <div class="role-buttons">
          <button onclick="showGirlLogin()">👧 Señorita</button>
          <button onclick="showLeaderLogin()">👩‍🏫 Líder</button>
        </div>
      `;
    }

    function showGirlLogin() {
      let options = '<option value="">Selecciona tu nombre</option>';
      DEFAULT_NAMES.forEach(name => {
        options += `<option value="${name}">${name}</option>`;
      });
      
      content.innerHTML = `
        <select id="girlName" onchange="checkGirl()">
          ${options}
        </select>
        <input type="password" id="girlPin" placeholder="PIN (0000)" onkeyup="checkGirl()">
        <button onclick="loginGirl()">Entrar</button>
        <button onclick="showRole()" style="background: #999; margin-top: 10px;">Atrás</button>
        <div id="error" class="error"></div>
      `;
    }

    function checkGirl() {
      const name = document.getElementById('girlName')?.value;
      const pin = document.getElementById('girlPin')?.value;
      if (name && pin.length === 4) {
        loginGirl();
      }
    }

    function loginGirl() {
      const name = document.getElementById('girlName')?.value;
      const pin = document.getElementById('girlPin')?.value;
      if (!name) {
        document.getElementById('error').textContent = 'Selecciona tu nombre';
        return;
      }
      if (pin !== '0000') {
        document.getElementById('error').textContent = 'PIN incorrecto';
        return;
      }
      showGirlHome(name);
    }

    function showGirlHome(name) {
      content.innerHTML = `
        <div style="text-align: center;">
          <h2 style="font-size: 20px; margin-bottom: 20px;">¡Hola ${name}!</h2>
          <p style="margin-bottom: 20px;">Bienvenida a Mi Devocional</p>
          <p style="font-size: 14px; color: #999; margin-bottom: 30px;">Devocional de hoy: Jesús te ama</p>
          <button onclick="showRole()" style="background: #999;">Salir</button>
        </div>
      `;
    }

    function showLeaderLogin() {
      content.innerHTML = `
        <p style="text-align: center; margin-bottom: 20px;">PIN de Líder</p>
        <input type="password" id="leaderPin" placeholder="PIN" onkeyup="checkLeader()">
        <button onclick="loginLeader()">Entrar</button>
        <button onclick="showRole()" style="background: #999; margin-top: 10px;">Atrás</button>
        <div id="error" class="error"></div>
      `;
    }

    function checkLeader() {
      const pin = document.getElementById('leaderPin')?.value;
      if (pin && pin.length === 4) {
        loginLeader();
      }
    }

    function loginLeader() {
      const pin = document.getElementById('leaderPin')?.value;
      if (pin !== '1234') {
        document.getElementById('error').textContent = 'PIN incorrecto';
        return;
      }
      showLeaderHome();
    }

    function showLeaderHome() {
      content.innerHTML = `
        <div style="text-align: center;">
          <h2 style="font-size: 20px; margin-bottom: 20px;">Panel de Líder</h2>
          <p style="margin-bottom: 30px;">Casa Apostólica Belén</p>
          <p style="margin-bottom: 20px;">Total de señoritas: ${DEFAULT_NAMES.length}</p>
          <button onclick="showRole()" style="background: #999;">Salir</button>
        </div>
      `;
    }

    // Iniciar app
    setTimeout(() => init(), 100);
  </script>
</body>
</html>
