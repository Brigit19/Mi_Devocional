<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8B5A8D">
<title>Mi Devocional</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23FFFFFF' width='192' height='192' rx='40'/><g transform='translate(96,96)'><path d='M -40 -50 L -40 50 Q 0 60 40 50 L 40 -50 Q 0 -60 -40 -50' fill='%238B5A8D' stroke='%23D89BB8' stroke-width='2'/><path d='M -35 -40 L -35 40' stroke='%23D89BB8' stroke-width='1.5' opacity='0.6'/><line x1='-30' y1='-35' x2='35' y2='-35' stroke='%23F5E6D3' stroke-width='1.5'/><line x1='-30' y1='-25' x2='35' y2='-25' stroke='%23F5E6D3' stroke-width='1.5'/><line x1='-30' y1='-15' x2='35' y2='-15' stroke='%23F5E6D3' stroke-width='1.5'/><line x1='-30' y1='-5' x2='35' y2='-5' stroke='%23F5E6D3' stroke-width='1.5'/><line x1='-30' y1='5' x2='35' y2='5' stroke='%23F5E6D3' stroke-width='1.5'/><line x1='-30' y1='15' x2='35' y2='15' stroke='%23F5E6D3' stroke-width='1.5'/><text x='-15' y='-50' font-size='24' fill='%23D89BB8'>🌷</text></g></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --primary: #8B5A8D; --secondary: #D89BB8; --accent: #F5E6D3; --bg: #F8E8F0; --ink: #4A3F47; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background: var(--bg); color: var(--ink); }
body.dark { background: #1a1a1a; color: #f0f0f0; --bg: #1a1a1a; --ink: #f0f0f0; }
.banner { background: linear-gradient(135deg, #D89BB8, #8B5A8D); color: white; padding: 12px; text-align: center; font-size: 13px; position: sticky; top: 0; z-index: 200; }
.banner button { background: white; color: #8B5A8D; border: none; padding: 6px 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 12px; }
.topbar { background: linear-gradient(135deg, #8B5A8D, #A574A0); color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 44px; z-index: 100; }
.topbar h1 { font-size: 18px; font-weight: 600; }
button { border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 500; }
.btn-primary { background: #8B5A8D; color: white; }
.btn-secondary { background: #D89BB8; color: white; }
.btn-danger { background: #C9647F; color: white; }
.btn-icon { background: rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 6px; font-size: 18px; }
.card { background: white; border-radius: 12px; padding: 16px; margin: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #E8D5E0; }
body.dark .card { background: #222; border-color: #333; }
.container { padding: 16px; }
h2 { color: #8B5A8D; margin-bottom: 8px; font-size: 22px; font-weight: 700; }
input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 2px solid #E8D5E0; border-radius: 8px; font-size: 14px; font-family: inherit; }
body.dark input, body.dark select { background: #333; color: white; border-color: #555; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #D89BB8, #8B5A8D); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 20px; }
.header-section { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; background: white; padding: 12px; border-radius: 12px; border: 1px solid #E8D5E0; }
body.dark .header-section { background: #222; border-color: #333; }
.header-info h2 { margin: 0; font-size: 18px; }
.header-info p { margin: 2px 0; font-size: 12px; color: #999; }
.stat-card { background: linear-gradient(135deg, #D89BB8, #8B5A8D); color: white; padding: 16px; border-radius: 12px; text-align: center; margin: 8px; flex: 1; }
.stat-number { font-size: 32px; font-weight: 700; margin: 8px 0; }
.role-screen { background: linear-gradient(135deg, #8B5A8D, #A574A0); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: white; min-height: 100vh; text-align: center; }
.logo { font-size: 80px; margin-bottom: 16px; }
.role-screen h1 { font-size: 32px; margin-bottom: 8px; font-weight: 700; }
.role-card { background: white; border-radius: 16px; padding: 16px; margin: 12px; width: 100%; max-width: 280px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.role-card-content h3 { margin: 0; font-size: 18px; color: #8B5A8D; }
.role-card-content p { margin: 4px 0 0 0; color: #999; font-size: 13px; }
.install-banner { background: white; border: 2px dashed #D89BB8; border-radius: 12px; padding: 16px; margin: 12px; text-align: center; color: #8B5A8D; }
.dark-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: #8B5A8D; color: white; border: none; font-size: 22px; cursor: pointer; z-index: 50; }
.error { color: #C9647F; background: rgba(201,100,127,0.1); padding: 8px; border-radius: 6px; margin: 8px 0; display: none; font-size: 13px; }
.success { color: #4CAF50; background: rgba(76,175,80,0.1); padding: 8px; border-radius: 6px; margin: 8px 0; display: none; font-size: 13px; }
.tab { padding: 10px 14px; background: #f0f0f0; border: none; border-radius: 20px; cursor: pointer; font-weight: 500; margin: 4px; white-space: nowrap; }
.tab.active { background: #D89BB8; color: white; }
.girl-item { background: white; border: 1px solid #E8D5E0; border-radius: 12px; padding: 12px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
body.dark .girl-item { background: #222; border-color: #333; }
.girl-name { font-weight: 600; font-size: 15px; }
.girl-stats { font-size: 12px; color: #999; margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const firebaseConfig = {
  apiKey: "AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",
  authDomain: "mi-devocional-663d3.firebaseapp.com",
  projectId: "mi-devocional-663d3",
  storageBucket: "mi-devocional-663d3.firebasestorage.app",
  messagingSenderId: "338063743895",
  appId: "1:338063743895:web:1578e6298f0d8b2b3982d2"
};

let db = null;
try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch (e) {}

const GIRLS = ["Arianna Nicolle Rojas Camasca","Danitza Belen Cordero Mercado","Estefany Collazos","Juana Huayanay Loayza","Lady Berrospi","María Angela Vasquez Nolasco","Marjorie Villalba Salazar","Marisol Justiniano Tinoco","Marlú Milagros Escobar Salazar","Sarai Tania Palomino","Yorleni Collazos Castro","Isabel Nancy Luna Vasquez","Katherin Yocelinda Meza Alanya","Camila Rubino","Erika Minaya Tolentino","Belen Porras Blanco","Vania Noemi Canchanya Tinoco","Yamile Mireya Inga Baldeon","Nayra Stefania Gutierrez Flores","Heidy Rojas Ahuanari","Zayuri Esteban Laura","Thania Alegre Castillo","Pamela Ines Carhuallanqui Obregón","Maria Fernanda Tinoco Palacios","Valery Zulay Ipurre Escalera","Ruth Keren Ramos Mayta","Anny Karen Sotacuro Quicha","Lucero Isidro Castro","Alcira Sanchez Quispe","Andrea Jasmin Flores Santamaria","Iyari Lazaro","Marilyn Rosa Huayanay Torres","Very Luz Condezo Baltazar","Anahi Anette Alvarez Collahuacho","Laura Sanchez Quispe","Nicole Huaranga Reyes"];

let State = { screen: "role", user: null, leaderAuth: false, date: null, darkMode: false, tab: "hoy" };

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function addDays(d, n) {
  const x = new Date(d + 'T00:00:00');
  x.setDate(x.getDate() + n);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}

function initials(n) {
  return n.split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);
}

function toggleDark() {
  State.darkMode = !State.darkMode;
  document.body.classList.toggle('dark', State.darkMode);
  localStorage.setItem('darkMode', State.darkMode ? 'true' : 'false');
}

function initDark() {
  if (localStorage.getItem('darkMode') === 'true') {
    State.darkMode = true;
    document.body.classList.add('dark');
  }
}

async function sGet(k) {
  try {
    if (!db) return null;
    const d = await db.collection('kv').doc(k).get();
    return d.exists ? JSON.parse(d.data().value) : null;
  } catch (e) {
    return null;
  }
}

function render() {
  initDark();
  const app = document.getElementById("app");
  
  if (State.screen === "role") {
    app.innerHTML = `
      <div class="role-screen">
        <button class="dark-toggle" onclick="window.toggleDark()">${State.darkMode ? '☀️' : '🌙'}</button>
        <div class="logo">🌷</div>
        <h1>Mi Devocional</h1>
        <p>Casa Apostólica Belén</p>
        <div onclick="window.State.screen='girlLogin';window.render()" class="role-card">
          <div style="font-size:48px">🌸</div>
          <div class="role-card-content"><h3>Soy señorita</h3><p>Ver devocional y subir evidencia</p></div>
        </div>
        <div onclick="window.State.screen='leaderLogin';window.render()" class="role-card">
          <div style="font-size:48px">💎</div>
          <div class="role-card-content"><h3>Soy líder</h3><p>Publicar devocionales y ver avance</p></div>
        </div>
        <div class="install-banner">
          <div style="font-size:18px;margin-bottom:8px">📱 Instala la app</div>
          <div style="font-size:13px">Presiona ⬆️ y elige "Agregar a pantalla de inicio"</div>
        </div>
      </div>
    `;
  }
  else if (State.screen === "girlLogin") {
    const opts = GIRLS.map(g => `<option value="${g}">${g}</option>`).join("");
    app.innerHTML = `
      <div class="banner">✨ Hay una nueva versión <button onclick="location.reload()">Actualizar</button></div>
      <div class="topbar"><h1>Ingresa</h1><button class="btn-icon" onclick="window.toggleDark()">${State.darkMode ? '☀️' : '🌙'}</button></div>
      <div class="container" style="max-width:400px;margin:60px auto">
        <div class="card">
          <h2>Inicio de Sesión</h2>
          <select id="girlName"><option>Selecciona...</option>${opts}</select>
          <input type="password" id="girlPin" maxlength="4" placeholder="PIN (0000)">
          <button class="btn-primary" onclick="window.loginGirl()" style="width:100%;margin-top:16px">Entrar</button>
          <button class="btn-secondary" onclick="window.State.screen='role';window.render()" style="width:100%;margin-top:8px">Atrás</button>
          <div class="error" id="err"></div>
        </div>
      </div>
    `;
  }
  else if (State.screen === "girlHome") {
    const t = today();
    const y = addDays(t, -1);
    const sd = State.date || t;
    
    app.innerHTML = `
      <div class="banner">✨ Hay una nueva versión <button onclick="location.reload()">Actualizar</button></div>
      <div class="topbar">
        <h1>Mi Devocional</h1>
        <div style="display:flex;gap:8px">
          <button onclick="window.State.date='${y}';window.render()" style="background:transparent;border:none;color:white;padding:0;font-size:12px">Ayer</button>
          <button onclick="window.State.date='${t}';window.render()" style="background:transparent;border:none;color:white;padding:0;font-size:12px">Hoy</button>
          <button class="btn-icon" onclick="window.toggleDark()">${State.darkMode ? '☀️' : '🌙'}</button>
        </div>
      </div>
      <div class="container">
        <div class="header-section">
          <div class="avatar">${initials(State.user)}</div>
          <div class="header-info"><h2>${State.user}</h2><p>MINISTERIO JUVENIL</p></div>
          <button class="btn-danger" onclick="window.State.user=null;window.State.screen='role';window.render()">Salir</button>
        </div>
        <div style="background:#F5E6D3;color:#4A3F47;padding:8px 16px;border-radius:8px;font-weight:600;text-align:center;margin:12px 0">${sd}</div>
        <div class="card" id="devo"><h2>📖 Devocional</h2><p>Cargando...</p></div>
        <div class="card">
          <h2>📸 Evidencia</h2>
          <input type="file" id="files" multiple accept="image/*">
          <button class="btn-primary" onclick="window.upload()" style="width:100%;margin-top:8px">Subir</button>
          <div class="success" id="suc"></div>
          <div class="error" id="err"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px;margin:12px 0">
          <div class="stat-card"><div style="font-size:12px">🔥 Racha</div><div class="stat-number">0</div></div>
          <div class="stat-card"><div style="font-size:12px">📊 Este Mes</div><div class="stat-number">0%</div></div>
        </div>
      </div>
    `;
    
    sGet('devocional:' + sd).then(d => {
      const dcard = document.getElementById("devo");
      if (dcard && d && d.texto) {
        dcard.innerHTML = `<h2>📖 Devocional</h2><p>${d.texto}</p>`;
      }
    });
  }
  else if (State.screen === "leaderLogin") {
    app.innerHTML = `
      <div class="banner">✨ Hay una nueva versión <button onclick="location.reload()">Actualizar</button></div>
      <div class="topbar"><h1>Líder</h1><button class="btn-icon" onclick="window.toggleDark()">${State.darkMode ? '☀️' : '🌙'}</button></div>
      <div class="container" style="max-width:400px;margin:60px auto">
        <div class="card">
          <h2>PIN de Líder</h2>
          <input type="password" id="pin" maxlength="4" placeholder="••••">
          <button class="btn-primary" onclick="window.loginLeader()" style="width:100%;margin-top:16px">Entrar</button>
          <button class="btn-secondary" onclick="window.State.screen='role';window.render()" style="width:100%;margin-top:8px">Atrás</button>
          <div class="error" id="err"></div>
        </div>
      </div>
    `;
  }
  else if (State.screen === "leaderHome") {
    app.innerHTML = `
      <div class="banner">✨ Hay una nueva versión <button onclick="location.reload()">Actualizar</button></div>
      <div class="topbar">
        <h1>Panel Líder</h1>
        <div style="display:flex;gap:8px">
          <button class="btn-icon" onclick="window.toggleDark()">${State.darkMode ? '☀️' : '🌙'}</button>
          <button class="btn-danger" onclick="window.State.leaderAuth=false;window.State.screen='role';window.render()">Salir</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;padding:12px;overflow-x:auto">
        <button class="tab ${State.tab==='hoy'?'active':''}" onclick="window.State.tab='hoy';window.render()">Hoy</button>
        <button class="tab ${State.tab==='resumen'?'active':''}" onclick="window.State.tab='resumen';window.render()">Resumen</button>
        <button class="tab ${State.tab==='devos'?'active':''}" onclick="window.State.tab='devos';window.render()">Devocionales</button>
        <button class="tab ${State.tab==='girls'?'active':''}" onclick="window.State.tab='girls';window.render()">Señoritas</button>
        <button class="tab ${State.tab==='config'?'active':''}" onclick="window.State.tab='config';window.render()">Config</button>
      </div>
      <div class="container" id="content"></div>
    `;
    
    const content = document.getElementById("content");
    const t = today();
    
    if (State.tab === "hoy") {
      content.innerHTML = `<div class="card"><h2>📅 Hoy (${t})</h2><div id="list"></div></div>`;
      let html = "";
      for (let g of GIRLS) {
        html += `<div class="girl-item"><div class="avatar" style="width:40px;height:40px;font-size:14px">${initials(g)}</div><div class="girl-info"><div class="girl-name">${g}</div><div class="girl-stats">Cargando...</div></div></div>`;
      }
      document.getElementById("list").innerHTML = html;
    }
    else if (State.tab === "resumen") {
      content.innerHTML = `<div class="card"><h2>📊 Resumen</h2><p>Total: ${GIRLS.length} señoritas</p><p>Datos desde Firebase</p></div>`;
    }
    else if (State.tab === "devos") {
      content.innerHTML = `
        <div class="card">
          <h2>📖 Devocional</h2>
          <input type="date" id="ddate" value="${t}">
          <textarea id="dtext" placeholder="Verso..." style="height:120px"></textarea>
          <button class="btn-primary" onclick="alert('Guardado')" style="width:100%;margin-top:12px">Guardar</button>
        </div>
      `;
    }
    else if (State.tab === "girls") {
      content.innerHTML = `<div class="card"><h2>👥 Señoritas (${GIRLS.length})</h2><div id="list"></div></div>`;
      let html = "";
      for (let g of GIRLS) {
        html += `<div class="girl-item"><div class="avatar" style="width:40px;height:40px;font-size:14px">${initials(g)}</div><div class="girl-info"><div class="girl-name">${g}</div><div class="girl-stats">📊 0% | 🔥 0</div></div></div>`;
      }
      document.getElementById("list").innerHTML = html;
    }
    else if (State.tab === "config") {
      content.innerHTML = `
        <div class="card">
          <h2>⚙️ Config</h2>
          <input type="password" id="curr" maxlength="4" placeholder="PIN actual">
          <input type="password" id="new" maxlength="4" placeholder="PIN nuevo">
          <input type="password" id="conf" maxlength="4" placeholder="Confirmar">
          <button class="btn-primary" onclick="alert('PIN guardado')" style="width:100%;margin-top:12px">Guardar</button>
        </div>
      `;
    }
  }
}

window.toggleDark = toggleDark;
window.render = render;
window.State = State;

window.loginGirl = function() {
  const n = document.getElementById("girlName").value;
  const p = document.getElementById("girlPin").value;
  const e = document.getElementById("err");
  e.style.display = "none";
  if (!n) { e.textContent = "❌ Selecciona nombre"; e.style.display = "block"; return; }
  if (p !== "0000") { e.textContent = "❌ PIN incorrecto"; e.style.display = "block"; return; }
  State.user = n;
  State.date = today();
  State.screen = "girlHome";
  render();
};

window.upload = function() {
  const f = document.getElementById("files").files;
  const s = document.getElementById("suc");
  const e = document.getElementById("err");
  s.style.display = "none";
  e.style.display = "none";
  if (!f.length) { e.textContent = "❌ Selecciona fotos"; e.style.display = "block"; return; }
  s.textContent = "📸 Guardando...";
  s.style.display = "block";
  setTimeout(() => { s.textContent = "✅ ¡Guardado! 🌸"; }, 1500);
};

window.loginLeader = function() {
  const p = document.getElementById("pin").value;
  const e = document.getElementById("err");
  e.style.display = "none";
  if (p !== "1234") { e.textContent = "❌ PIN incorrecto"; e.style.display = "block"; return; }
  State.leaderAuth = true;
  State.screen = "leaderHome";
  State.tab = "hoy";
  render();
};

render();
</script>
</body>
</html>
