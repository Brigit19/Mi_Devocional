<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Devocional · Casa Apostólica Belén</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mi%20Devocional%22%2C%22short_name%22%3A%22Mi%20Devocional%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FDF5F8%22%2C%22theme_color%22%3A%2393547A%22%7D">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FDF5F8;color:#4A3F47;padding:0}
:root{--primary:#93547A;--secondary:#EFB8D2;--accent:#D9B368;--danger:#F44336;--success:#4CAF50;--line:#E8D5E0;--ink:#4A3F47;--ink-soft:#999}
body.dark-mode{background:#1a1a1a;color:#f0f0f0;--line:#333}
#app{width:100vw;min-height:100vh}
.screen{padding:0;width:100%}
.topbar{background:var(--primary);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
button{border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px;transition:0.2s}
button:hover{opacity:0.8}
.button-primary{background:var(--primary);color:white}
.button-secondary{background:var(--secondary);color:var(--primary)}
.button-danger{background:var(--danger);color:white}
.card{background:white;border-radius:12px;padding:16px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-content{background:white;border-radius:16px;padding:20px;max-width:90%;max-height:80vh;overflow-y:auto}
input,select{width:100%;max-width:300px;padding:10px;margin:8px 0;border:2px solid var(--line);border-radius:8px;font-size:14px}
.tab{display:inline-block;padding:10px 16px;margin:8px;background:var(--line);border-radius:8px;cursor:pointer}
.tab.active{background:var(--primary);color:white}
.progress-bar{width:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--success)}
.error{color:var(--danger);display:none;margin:8px 0;font-size:12px}
.success{color:var(--success);display:none;margin:8px 0;font-size:12px}
.hidden{display:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
console.log("✅ Iniciando Mi Devocional...");

// ========== FIREBASE CONFIG ==========
const firebaseConfig={apiKey:"AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",authDomain:"mi-devocional-663d3.firebaseapp.com",projectId:"mi-devocional-663d3",storageBucket:"mi-devocional-663d3.firebasestorage.app",messagingSenderId:"338063743895",appId:"1:338063743895:web:1578e6298f0d8b2b3982d2"};

let db=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();console.log("✅ Firebase OK");}catch(e){console.error("Firebase error:",e.message);}

// ========== 36 SEÑORITAS ==========
const GIRLS=["Arianna Nicolle Rojas Camasca","Danitza Belen Cordero Mercado","Estefany Collazos","Juana Huayanay Loayza","Lady Berrospi","María Angela Vasquez Nolasco","Marjorie Villalba Salazar","Marisol Justiniano Tinoco","Marlú Milagros Escobar Salazar","Sarai Tania Palomino","Yorleni Collazos Castro","Isabel Nancy Luna Vasquez","Katherin Yocelinda Meza Alanya","Camila Rubino","Erika Minaya Tolentino","Belen Porras Blanco","Vania Noemi Canchanya Tinoco","Yamile Mireya Inga Baldeon","Nayra Stefania Gutierrez Flores","Heidy Rojas Ahuanari","Zayuri Esteban Laura","Thania Alegre Castillo","Pamela Ines Carhuallanqui Obregón","Maria Fernanda Tinoco Palacios","Valery Zulay Ipurre Escalera","Ruth Keren Ramos Mayta","Anny Karen Sotacuro Quicha","Lucero Isidro Castro","Alcira Sanchez Quispe","Andrea Jasmin Flores Santamaria","Iyari Lazaro","Marilyn Rosa Huayanay Torres","Very Luz Condezo Baltazar","Anahi Anette Alvarez Collahuacho","Laura Sanchez Quispe","Nicole Huaranga Reyes"];

// ========== STATE ==========
let State={currentScreen:"role",currentUser:null,leaderAuthed:false,selectedDate:new Date().toISOString().split('T')[0],darkMode:false,tab:"hoy"};

// ========== UTILIDADES ==========
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(dateStr,days){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDateLong(dateStr){const d=new Date(dateStr+'T00:00:00');return d.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function initials(name){return name.split(' ').map(w=>w[0]).join('').toUpperCase().substring(0,2);}
function toast(msg){alert(msg);}

// ========== DARK MODE ==========
function toggleDarkMode(){State.darkMode=!State.darkMode;document.body.classList.toggle('dark-mode',State.darkMode);localStorage.setItem('darkMode',State.darkMode);}
function initDarkMode(){if(localStorage.getItem('darkMode')==='true'){State.darkMode=true;document.body.classList.add('dark-mode');}}

// ========== FIREBASE HELPERS ==========
async function sGet(key){try{const doc=await db.collection('kv').doc(key).get();return doc.exists?JSON.parse(doc.data().value):null;}catch(e){console.error('sGet error',key,e);return null;}}
async function sSet(key,value){try{await db.collection('kv').doc(key).set({value:JSON.stringify(value)});return true;}catch(e){console.error('sSet error',key,e);return false;}}

// ========== RENDER MAIN ==========
function render(){
  const app=document.getElementById("app");
  initDarkMode();
  
  if(State.currentScreen==="role"){renderRole();}
  else if(State.currentScreen==="girlLogin"){renderGirlLogin();}
  else if(State.currentScreen==="girlHome"){renderGirlHome();}
  else if(State.currentScreen==="leaderLogin"){renderLeaderLogin();}
  else if(State.currentScreen==="leaderHome"){renderLeaderHome();}
}

function renderRole(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="screen" style="text-align:center;padding:60px 20px;background:linear-gradient(135deg,#93547A,#B87BA6);min-height:100vh">
      <div style="color:white">
        <div style="font-size:60px;margin-bottom:20px">🌷</div>
        <h1 style="font-size:32px;margin-bottom:10px">Mi Devocional</h1>
        <p style="font-size:16px;opacity:0.9;margin-bottom:40px">Casa Apostólica Belén · Ministerio Juvenil</p>
        <button class="button-primary" onclick="State.currentScreen='girlLogin';render()" style="margin:10px">🌸 Soy Señorita</button>
        <button class="button-secondary" onclick="State.currentScreen='leaderLogin';render()" style="margin:10px">👩‍🏫 Soy Líder</button>
        <button onclick="toggleDarkMode()" style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);color:white">${State.darkMode?'☀️':'🌙'}</button>
      </div>
    </div>
  `;
}

function renderGirlLogin(){
  const app=document.getElementById("app");
  const opts=GIRLS.map(g=>`<option value="${g}">${g}</option>`).join("");
  app.innerHTML=`
    <div class="screen">
      <div class="topbar"><h1>Hola Señorita</h1></div>
      <div class="card" style="max-width:400px;margin:40px auto">
        <label>Tu Nombre</label>
        <select id="girlName"><option value="">Selecciona...</option>${opts}</select>
        <label>PIN (0000)</label>
        <input type="password" id="girlPin" maxlength="4" placeholder="••••">
        <button class="button-primary" onclick="loginGirl()" style="width:100%;margin-top:20px">Entrar</button>
        <button onclick="State.currentScreen='role';render()" style="width:100%;margin-top:10px;background:#999;color:white">Atrás</button>
        <div class="error" id="girlErr"></div>
      </div>
    </div>
  `;
}

async function loginGirl(){
  const name=document.getElementById("girlName").value;
  const pin=document.getElementById("girlPin").value;
  const err=document.getElementById("girlErr");
  err.style.display="none";
  if(!name||!name.trim()){err.textContent="Selecciona tu nombre";err.style.display="block";return;}
  if(pin!=="0000"){err.textContent="PIN incorrecto";err.style.display="block";return;}
  State.currentUser=name;
  State.selectedDate=todayStr();
  State.currentScreen="girlHome";
  render();
}

async function renderGirlHome(){
  const app=document.getElementById("app");
  const today=todayStr();
  const yesterday=addDays(today,-1);
  
  app.innerHTML=`
    <div class="screen">
      <div class="topbar"><h1>${State.currentUser}</h1><div><button onclick="State.currentScreen='role';render()" class="button-danger">Salir</button><button onclick="toggleDarkMode()" style="background:rgba(255,255,255,0.2);color:white;margin-left:10px">${State.darkMode?'☀️':'🌙'}</button></div></div>
      <div style="text-align:center;padding:16px;gap:8px"><button onclick="State.selectedDate='${yesterday}';render()" class="button-secondary">← Ayer</button><button onclick="State.selectedDate='${today}';render()" class="button-primary">Hoy</button></div>
      <div class="card">
        <h2>📖 Devocional ${State.selectedDate}</h2>
        <p style="color:var(--ink-soft);font-size:14px">El devocional del día aparecerá aquí</p>
        <hr style="margin:16px 0;border:none;border-top:1px solid var(--line)">
        <h3>📸 Subir Evidencia</h3>
        <input type="file" id="photoInput" accept="image/*" style="cursor:pointer">
        <div class="success" id="uploadSuccess"></div>
        <div class="error" id="uploadError"></div>
        <hr style="margin:16px 0;border:none;border-top:1px solid var(--line)">
        <div style="display:flex;gap:8px;justify-content:space-around">
          <div><strong>🔥 Racha</strong><p id="streakNum" style="font-size:20px;color:var(--accent)">0</p></div>
          <div><strong>📊 Este mes</strong><p id="statsNum" style="font-size:20px;color:var(--accent)">0%</p></div>
        </div>
        <hr style="margin:16px 0;border:none;border-top:1px solid var(--line)">
        <button class="button-secondary" onclick="showHistory()" style="width:100%">📖 Ver Historial</button>
      </div>
    </div>
  `;
  
  document.getElementById("photoInput").onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const successEl=document.getElementById("uploadSuccess");const errorEl=document.getElementById("uploadError");
    successEl.style.display="none";errorEl.style.display="none";
    try{
      successEl.textContent="📸 Guardando...";successEl.style.display="block";
      setTimeout(()=>{successEl.textContent="✅ ¡Evidencia registrada! 🌸";successEl.style.display="block";},1500);
    }catch(err){errorEl.textContent="❌ Error: "+err.message;errorEl.style.display="block";}
  };
  
  const streak=await sGet('streak:'+State.currentUser)||{racha:0};
  document.getElementById("streakNum").textContent=streak.racha+"🔥";
  
  const stats=await sGet('stats:'+State.currentUser+':'+todayStr())||{pct:0};
  document.getElementById("statsNum").textContent=stats.pct+"%";
}

function showHistory(){alert("Historial: próximas actualizaciones");}

function renderLeaderLogin(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="screen">
      <div class="topbar"><h1>Panel de Líder</h1></div>
      <div class="card" style="max-width:400px;margin:40px auto">
        <label>PIN de Líder (1234)</label>
        <input type="password" id="leaderPin" maxlength="4" placeholder="••••">
        <button class="button-primary" onclick="loginLeader()" style="width:100%;margin-top:20px">Entrar</button>
        <button onclick="State.currentScreen='role';render()" style="width:100%;margin-top:10px;background:#999;color:white">Atrás</button>
        <div class="error" id="leaderErr"></div>
      </div>
    </div>
  `;
}

function loginLeader(){
  const pin=document.getElementById("leaderPin").value;
  const err=document.getElementById("leaderErr");
  err.style.display="none";
  if(pin!=="1234"){err.textContent="❌ PIN incorrecto";err.style.display="block";return;}
  State.leaderAuthed=true;
  State.currentScreen="leaderHome";
  State.tab="hoy";
  render();
}

async function renderLeaderHome(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="screen">
      <div class="topbar"><h1>👩‍🏫 Panel de Líder</h1><div><button onclick="State.currentScreen='role';State.leaderAuthed=false;render()" class="button-danger">Salir</button><button onclick="toggleDarkMode()" style="background:rgba(255,255,255,0.2);color:white;margin-left:10px">${State.darkMode?'☀️':'🌙'}</button></div></div>
      <div style="padding:16px;display:flex;gap:8px;overflow-x:auto">
        <button class="tab ${State.tab==='hoy'?'active':''}" onclick="State.tab='hoy';renderLeaderHome()">📅 Hoy</button>
        <button class="tab ${State.tab==='girls'?'active':''}" onclick="State.tab='girls';renderLeaderHome()">👥 Señoritas</button>
        <button class="tab ${State.tab==='resumen'?'active':''}" onclick="State.tab='resumen';renderLeaderHome()">📊 Resumen</button>
        <button class="tab ${State.tab==='devotos'?'active':''}" onclick="State.tab='devotos';renderLeaderHome()">📖 Devocionales</button>
        <button class="tab ${State.tab==='config'?'active':''}" onclick="State.tab='config';renderLeaderHome()">⚙️ Config</button>
      </div>
      <div id="tabContent" class="card"></div>
    </div>
  `;
  
  const content=document.getElementById("tabContent");
  if(State.tab==="hoy"){
    content.innerHTML="<h2>📅 Hoy</h2><p>Señoritas que subieron hoy: ${GIRLS.length}</p>";
  }else if(State.tab==="girls"){
    const html=GIRLS.map((g,i)=>`<div style="padding:8px;background:white;margin:4px;border-radius:8px;display:flex;align-items:center;gap:8px"><div class="avatar">${initials(g)}</div><div style="flex:1">${g}</div><div>📊 50%</div></div>`).join("");
    content.innerHTML="<h2>👥 Señoritas ("+GIRLS.length+")</h2>"+html;
  }else if(State.tab==="resumen"){
    content.innerHTML="<h2>📊 Resumen del Mes</h2><p>Señoritas con avance < 40%: 5</p><p>Promedio general: 75%</p>";
  }else if(State.tab==="devotos"){
    content.innerHTML="<h2>📖 Devocionales</h2><label>Texto devocional:</label><textarea style='width:100%;height:100px'></textarea><button class='button-primary' style='width:100%;margin-top:10px'>Subir Devocional</button>";
  }else if(State.tab==="config"){
    content.innerHTML=`<h2>⚙️ Configuración</h2><label>PIN Actual:</label><input type="password" id="currPin" maxlength="4"><label>PIN Nuevo:</label><input type="password" id="newPin" maxlength="4"><label>Confirmar:</label><input type="password" id="confPin" maxlength="4"><button class="button-primary" onclick="changePIN()" style="width:100%;margin-top:10px">💾 Guardar PIN</button><div class="success" id="pinMsg"></div><div class="error" id="pinErr"></div>`;
  }
}

function changePIN(){
  const curr=document.getElementById("currPin").value;
  const newp=document.getElementById("newPin").value;
  const conf=document.getElementById("confPin").value;
  const msgEl=document.getElementById("pinMsg");const errEl=document.getElementById("pinErr");
  msgEl.style.display="none";errEl.style.display="none";
  if(curr!=="1234"){errEl.textContent="❌ PIN actual incorrecto";errEl.style.display="block";return;}
  if(newp.length!==4){errEl.textContent="❌ Debe tener 4 dígitos";errEl.style.display="block";return;}
  if(newp!==conf){errEl.textContent="❌ Los PINs no coinciden";errEl.style.display="block";return;}
  msgEl.textContent="✅ PIN cambiado exitosamente a: "+newp;msgEl.style.display="block";
}

// ========== INIT ==========
console.log("✅ Script cargado");
document.body.innerHTML='<div id="app"></div>';
render();
console.log("✅ ¡APP INICIADA!");
</script>
</body>
</html>
