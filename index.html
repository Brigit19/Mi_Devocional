<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Devocional</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDF5F8;
  --bg-card: #f5e8f0;
  --primary-dark: #93547A;
  --primary: #8B5A8D;
  --secondary: #C98CAE;
  --accent: #FCEEDD;
  --success: #6fa86f;
  --danger: #C97676;
  --gold: #E8C547;
  --gold-soft: #f5e8b0;
  --line: #e8d5e0;
  --ink: #2c2c2c;
  --ink-soft: #7a7a7a;
  --fuchsia: #D96ACE;
}

[data-darkmode="true"] {
  --bg: #1a1a1a;
  --bg-card: #2d2d2d;
  --ink: #e8e8e8;
  --ink-soft: #b0b0b0;
  --line: #3a3a3a;
}

* {
  box-sizing: border-box;
}

html,body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}

h1,h2,h3,h4,h5,h6 {
  font-family: 'Playfair Display', serif;
  margin: 0;
}

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
}

main {
  flex: 1;
}

.screen {
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 0 0 16px 16px;
  margin-bottom: 16px;
  z-index: 9999;
  position: relative;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: 0.2s;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-dark);
}

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  padding: 8px;
  color: #fff;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: var(--bg-card);
  padding: 24px;
  border-radius: 16px;
  max-width: 400px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--ink);
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  background: var(--success);
  color: #fff;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 10000;
  animation: fadeUp 0.3s ease;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.lock-note {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--gold-soft);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 12.5px;
  color: var(--primary-dark);
  margin-top: 16px;
}
</style>
</head>
<body>

<div id="app">
  <main id="main"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",
  authDomain: "mi-devocional-663d3.firebaseapp.com",
  projectId: "mi-devocional-663d3",
  storageBucket: "mi-devocional-663d3.firebasestorage.app",
  messagingSenderId: "338063743895",
  appId: "1:338063743895:web:1578e6298f0d8b2b3982d2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const appEl = document.getElementById('app');
const main = document.getElementById('main');

const $ = (id) => document.getElementById(id);
const State = { names: [], config: {}, currentUser: null, leaderAuthed: false, tab: 'hoy', filter: 'todas' };

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtDateLong(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-PE', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function sGet(key) {
  try {
    const doc = await db.collection('kv').doc(key).get();
    if (!doc.exists) return null;
    return JSON.parse(doc.data().value);
  } catch (e) {
    console.error('sGet error', e);
    return null;
  }
}

async function sSet(key, value) {
  try {
    await db.collection('kv').doc(key).set({ value: JSON.stringify(value) });
    return true;
  } catch (e) {
    console.error('sSet error', e);
    return false;
  }
}

function render(screen) {
  State.screen = screen;
  main.innerHTML = '';
  
  if (screen === 'role') {
    main.innerHTML = `
    <div class="screen">
      <div style="text-align:center;padding:60px 20px;">
        <h1 style="font-size:32px;margin-bottom:30px;">Mi Devocional</h1>
        <button id="girlBtn" class="btn btn-primary" style="width:100%;margin-bottom:10px;padding:12px;">Soy señorita</button>
        <button id="leaderBtn" class="btn btn-primary" style="width:100%;padding:12px;">Soy líder</button>
      </div>
    </div>`;
    
    $('girlBtn').onclick = () => render('girlLogin');
    $('leaderBtn').onclick = () => render('leaderLogin');
  }
  
  if (screen === 'girlLogin') {
    main.innerHTML = `
    <div class="screen">
      <div style="text-align:center;padding:60px 20px;">
        <h1 style="font-size:24px;margin-bottom:20px;">Señorita</h1>
        <p>¿Cuál es tu nombre?</p>
        <select id="girlSelect" style="width:100%;padding:10px;margin:20px 0;border-radius:8px;">
          <option>Selecciona tu nombre</option>
        </select>
        <p>PIN: <input type="tel" id="girlPin" maxlength="4" style="padding:8px;border-radius:8px;border:1px solid var(--line);" placeholder="0000"></p>
        <button id="girlEnter" class="btn btn-primary" style="width:100%;padding:12px;margin-top:20px;">Entrar</button>
        <button id="girlBack" class="btn" style="width:100%;padding:12px;margin-top:10px;background:var(--line);color:var(--ink);">Atrás</button>
      </div>
    </div>`;
    
    const select = $('girlSelect');
    State.names.forEach(girl => {
      const opt = document.createElement('option');
      opt.value = girl.id;
      opt.textContent = girl.nombre;
      select.appendChild(opt);
    });
    
    $('girlEnter').onclick = () => {
      const id = select.value;
      const pin = $('girlPin').value;
      if (!id || id === 'Selecciona tu nombre') return;
      if (pin !== '0000') { alert('PIN incorrecto'); return; }
      State.currentUser = State.names.find(n => n.id === id);
      render('girlHome');
    };
    
    $('girlBack').onclick = () => render('role');
  }
  
  if (screen === 'girlHome') {
    main.innerHTML = `
    <div class="screen">
      <div class="topbar">
        <div>${State.currentUser.nombre}</div>
        <button class="icon-btn" id="logout">Salir</button>
      </div>
      <h2>Bienvenida 🌸</h2>
      <p>Panel de señoritas</p>
    </div>`;
    
    $('logout').onclick = () => {
      State.currentUser = null;
      render('role');
    };
  }
  
  if (screen === 'leaderLogin') {
    main.innerHTML = `
    <div class="screen">
      <div style="text-align:center;padding:60px 20px;">
        <h1 style="font-size:24px;margin-bottom:20px;">Líder</h1>
        <p>PIN administrativo</p>
        <input type="tel" id="leaderPin" maxlength="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);margin:20px 0;" placeholder="1234">
        <button id="leaderEnter" class="btn btn-primary" style="width:100%;padding:12px;margin-top:20px;">Entrar</button>
        <button id="leaderBack" class="btn" style="width:100%;padding:12px;margin-top:10px;background:var(--line);color:var(--ink);">Atrás</button>
      </div>
    </div>`;
    
    $('leaderEnter').onclick = () => {
      const pin = $('leaderPin').value;
      if (pin !== '1234') { alert('PIN incorrecto'); return; }
      State.leaderAuthed = true;
      render('leaderHome');
    };
    
    $('leaderBack').onclick = () => render('role');
  }
  
  if (screen === 'leaderHome') {
    main.innerHTML = `
    <div class="screen">
      <div class="topbar">
        <div>Panel de Líder</div>
        <button class="icon-btn" id="logout2">Salir</button>
      </div>
      <h2>Bienvenida 👑</h2>
      <p>${State.names.length} señoritas registradas</p>
      <button class="btn btn-primary" style="width:100%;padding:12px;margin-top:20px;">Ver Evidencias</button>
    </div>`;
    
    $('logout2').onclick = () => {
      State.leaderAuthed = false;
      render('role');
    };
  }
}

async function init() {
  const seed = await sGet('seed');
  if (seed) {
    State.names = seed.names || [];
    State.config = seed.config || {};
  } else {
    State.names = [{id:'1', nombre:'Arianna'}, {id:'2', nombre:'Danitza'}, {id:'3', nombre:'Estefany'}];
    State.config = {leaderPin: '1234'};
    await sSet('seed', {names: State.names, config: State.config});
  }
  
  render('role');
  toast('✅ App cargada');
}

window.addEventListener('load', init);
</script>
</body>
</html>
