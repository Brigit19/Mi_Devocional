<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#93547A">
<meta name="description" content="Mi Devocional - App para seguimiento de devocionales">
<title>Mi Devocional · Casa Apostólica Belén</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><text x='96' y='140' font-size='100' text-anchor='middle'>🌷</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23FFFFFF' width='192' height='192'/><circle cx='96' cy='96' r='80' fill='%2393547A'/><text x='96' y='140' font-size='100' fill='white' text-anchor='middle'>🌷</text></svg>">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #93547A;
  --primary-dark: #7A4465;
  --secondary: #EFB8D2;
  --accent: #D9B368;
  --danger: #F44336;
  --success: #4CAF50;
  --line: #E8D5E0;
  --ink: #4A3F47;
  --ink-soft: #888;
  --bg: #FFFFFF;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding: 0;
  margin: 0;
  line-height: 1.6;
}

body.dark-mode {
  background: #1a1a1a;
  color: #f0f0f0;
  --bg: #1a1a1a;
  --line: #333;
  --ink: #f0f0f0;
  --ink-soft: #aaa;
}

#app {
  width: 100vw;
  min-height: 100vh;
}

.screen {
  width: 100%;
  min-height: 100vh;
  background: var(--bg);
}

.topbar {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  color: white;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 12px rgba(147, 84, 122, 0.2);
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar h1 {
  font-size: 20px;
  font-weight: 600;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
  font-weight: 500;
}

button:hover {
  opacity: 0.85;
  transform: translateY(-1px);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-secondary {
  background: var(--secondary);
  color: var(--primary);
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-icon {
  background: rgba(255, 255, 255, 0.2);
  color: white;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 18px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 16px;
  margin: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  border: 1px solid var(--line);
}

body.dark-mode .card {
  background: #222;
  border-color: #333;
}

.container {
  padding: 16px;
}

h2 {
  color: var(--primary);
  margin-bottom: 12px;
  font-size: 20px;
}

h3 {
  color: var(--primary);
  margin: 12px 0 8px 0;
  font-size: 16px;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 2px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(147, 84, 122, 0.1);
}

body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea {
  background: #333;
  color: white;
  border-color: #555;
}

.tabs {
  display: flex;
  gap: 8px;
  padding: 16px;
  overflow-x: auto;
  border-bottom: 2px solid var(--line);
  margin-bottom: 16px;
  background: var(--bg);
}

.tab {
  padding: 10px 16px;
  background: var(--line);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
  transition: all 0.3s;
}

.tab:hover {
  background: var(--secondary);
}

.tab.active {
  background: var(--primary);
  color: white;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
  margin: 8px 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--primary));
}

.error {
  color: var(--danger);
  display: none;
  margin: 8px 0;
  font-size: 12px;
  background: rgba(244, 67, 54, 0.1);
  padding: 8px;
  border-radius: 6px;
}

.success {
  color: var(--success);
  display: none;
  margin: 8px 0;
  font-size: 12px;
  background: rgba(76, 175, 80, 0.1);
  padding: 8px;
  border-radius: 6px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--secondary), var(--primary));
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 600;
  font-size: 16px;
}

.stat-card {
  background: linear-gradient(135deg, var(--secondary), var(--primary));
  color: white;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
  margin: 8px;
}

.stat-number {
  font-size: 28px;
  font-weight: 700;
  margin: 8px 0;
}

.girl-item {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

body.dark-mode .girl-item {
  background: #222;
  border-color: #333;
}

.girl-name {
  font-weight: 600;
}

.girl-stats {
  font-size: 12px;
  color: var(--ink-soft);
}

.date-button {
  flex: 1;
  padding: 12px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s;
}

.date-button.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.devo-card {
  background: linear-gradient(135deg, rgba(147, 84, 122, 0.05), rgba(239, 184, 210, 0.05));
  border: 2px solid var(--secondary);
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;
}

.devo-image {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin: 12px 0;
}

.banner {
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: white;
  padding: 16px;
  margin: 12px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(147, 84, 122, 0.3);
  display: flex;
  align-items: center;
  gap: 12px;
}

.banner-content {
  flex: 1;
}

.banner-title {
  font-weight: 600;
  font-size: 14px;
}

.banner-text {
  font-size: 12px;
  opacity: 0.95;
  margin-top: 4px;
}

.empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--ink-soft);
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
console.log("✅ Mi Devocional iniciando...");

// Registrar Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    console.log('✅ Service Worker registrado');
  }).catch(err => {
    console.log('Service Worker error:', err.message);
  });
}

const firebaseConfig={apiKey:"AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",authDomain:"mi-devocional-663d3.firebaseapp.com",projectId:"mi-devocional-663d3",storageBucket:"mi-devocional-663d3.firebasestorage.app",messagingSenderId:"338063743895",appId:"1:338063743895:web:1578e6298f0d8b2b3982d2"};

let db=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();console.log("✅ Firebase OK");}catch(e){console.error("Firebase:",e.message);}

const GIRLS=["Arianna Nicolle Rojas Camasca","Danitza Belen Cordero Mercado","Estefany Collazos","Juana Huayanay Loayza","Lady Berrospi","María Angela Vasquez Nolasco","Marjorie Villalba Salazar","Marisol Justiniano Tinoco","Marlú Milagros Escobar Salazar","Sarai Tania Palomino","Yorleni Collazos Castro","Isabel Nancy Luna Vasquez","Katherin Yocelinda Meza Alanya","Camila Rubino","Erika Minaya Tolentino","Belen Porras Blanco","Vania Noemi Canchanya Tinoco","Yamile Mireya Inga Baldeon","Nayra Stefania Gutierrez Flores","Heidy Rojas Ahuanari","Zayuri Esteban Laura","Thania Alegre Castillo","Pamela Ines Carhuallanqui Obregón","Maria Fernanda Tinoco Palacios","Valery Zulay Ipurre Escalera","Ruth Keren Ramos Mayta","Anny Karen Sotacuro Quicha","Lucero Isidro Castro","Alcira Sanchez Quispe","Andrea Jasmin Flores Santamaria","Iyari Lazaro","Marilyn Rosa Huayanay Torres","Very Luz Condezo Baltazar","Anahi Anette Alvarez Collahuacho","Laura Sanchez Quispe","Nicole Huaranga Reyes"];

let State={screen:"role",user:null,leaderAuth:false,date:null,darkMode:false,tab:"hoy"};

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function fmtDate(d){const x=new Date(d+'T00:00:00');return x.toLocaleDateString('es-ES',{weekday:'long',month:'long',day:'numeric'});}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().substring(0,2);}

function toggleDark(){
  State.darkMode=!State.darkMode;
  document.body.classList.toggle('dark-mode',State.darkMode);
  localStorage.setItem('darkMode',State.darkMode?'true':'false');
  console.log("🌙 Dark mode:", State.darkMode);
}

function initDark(){
  if(localStorage.getItem('darkMode')==='true'){
    State.darkMode=true;
    document.body.classList.add('dark-mode');
  }
}

async function sGet(k){try{const d=await db.collection('kv').doc(k).get();return d.exists?JSON.parse(d.data().value):null;}catch(e){return null;}}
async function sSet(k,v){try{await db.collection('kv').doc(k).set({value:JSON.stringify(v)});return true;}catch(e){return false;}}

function render(){
  initDark();
  const app=document.getElementById("app");
  
  if(State.screen==="role"){renderRole();}
  else if(State.screen==="girlLogin"){renderGirlLogin();}
  else if(State.screen==="girlHome"){renderGirlHome();}
  else if(State.screen==="leaderLogin"){renderLeaderLogin();}
  else if(State.screen==="leaderHome"){renderLeaderHome();}
}

function renderRole(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="screen" style="background:linear-gradient(135deg,#93547A,#B87BA6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:white">
      <div style="text-align:center">
        <div style="font-size:80px;margin-bottom:20px">🌷</div>
        <h1 style="font-size:36px;margin-bottom:8px;font-weight:700">Mi Devocional</h1>
        <p style="font-size:18px;opacity:0.95;margin-bottom:40px">Casa Apostólica Belén<br>Ministerio Juvenil</p>
        <button class="btn-secondary" onclick="State.screen='girlLogin';render()" style="width:200px;margin:10px;font-size:16px;padding:12px">🌸 Soy Señorita</button>
        <button class="btn-primary" onclick="State.screen='leaderLogin';render()" style="width:200px;margin:10px;font-size:16px;padding:12px;background:white;color:#93547A">👩‍🏫 Soy Líder</button>
      </div>
      <button class="btn-icon" onclick="toggleDark()" style="position:absolute;top:20px;right:20px;font-size:20px" title="Cambiar brillo">${State.darkMode?'☀️':'🌙'}</button>
      <div class="banner" style="position:absolute;bottom:20px;left:20px;right:20px;margin:0">
        <div style="font-size:24px">📥</div>
        <div class="banner-content">
          <div class="banner-title">Instala la app en tu dispositivo</div>
          <div class="banner-text">Presiona ⬆️ (compartir) y elige "Agregar a pantalla de inicio"</div>
        </div>
      </div>
    </div>
  `;
}

function renderGirlLogin(){
  const app=document.getElementById("app");
  const opts=GIRLS.map(g=>`<option value="${g}">${g}</option>`).join("");
  app.innerHTML=`
    <div class="screen">
      <div class="topbar"><h1>👋 Hola Señorita</h1><button class="btn-icon" onclick="toggleDark()" title="Cambiar brillo">${State.darkMode?'☀️':'🌙'}</button></div>
      <div class="container" style="max-width:400px;margin:60px auto">
        <div class="card">
          <h2>Inicio de Sesión</h2>
          <label>Tu Nombre:</label>
          <select id="girlName"><option value="">Selecciona...</option>${opts}</select>
          <label>PIN (0000):</label>
          <input type="password" id="girlPin" maxlength="4" placeholder="••••">
          <button class="btn-primary" onclick="loginGirl()" style="width:100%;margin-top:16px">✅ Entrar</button>
          <button class="btn-secondary" onclick="State.screen='role';render()" style="width:100%;margin-top:8px">← Atrás</button>
          <div class="error" id="girlErr"></div>
        </div>
      </div>
    </div>
  `;
}

function loginGirl(){
  const n=document.getElementById("girlName").value;
  const p=document.getElementById("girlPin").value;
  const e=document.getElementById("girlErr");
  e.style.display="none";
  if(!n){e.textContent="❌ Selecciona tu nombre";e.style.display="block";return;}
  if(p!=="0000"){e.textContent="❌ PIN incorrecto (0000)";e.style.display="block";return;}
  State.user=n;State.date=today();State.screen="girlHome";render();
}

async function renderGirlHome(){
  const app=document.getElementById("app");
  const t=today();const y=addDays(t,-1);
  const sd=State.date||t;
  
  app.innerHTML=`
    <div class="screen">
      <div class="topbar">
        <h1>${State.user}</h1>
        <div class="topbar-actions">
          <button class="btn-icon" onclick="toggleDark()" title="Cambiar brillo">${State.darkMode?'☀️':'🌙'}</button>
          <button class="btn-danger" onclick="State.user=null;State.screen='role';render()">🚪 Salir</button>
        </div>
      </div>
      <div class="container">
        <div class="banner">
          <div style="font-size:20px">🌸</div>
          <div class="banner-content">
            <div class="banner-title">¡Nueva versión disponible!</div>
            <div class="banner-text">Presiona el botón actualizar para mejorar la app</div>
          </div>
        </div>
        
        <div style="display:flex;gap:8px;padding:16px 12px;margin-bottom:12px">
          <button class="date-button ${sd===y?'active':''}" onclick="State.date='${y}';render()">← Ayer</button>
          <button class="date-button ${sd===t?'active':''}" onclick="State.date='${t}';render()">Hoy →</button>
        </div>
        
        <div class="card" id="devoCard"><h2>📖 Devocional</h2><p style="color:var(--ink-soft)">Cargando...</p></div>
        
        <div class="card">
          <h3>📸 Subir Evidencia</h3>
          <input type="file" id="photoInput" accept="image/*" multiple>
          <button class="btn-primary" onclick="uploadPhotos()" style="width:100%;margin-top:8px">📤 Subir</button>
          <div class="success" id="uploadSuccess"></div>
          <div class="error" id="uploadError"></div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px">
          <div class="stat-card"><div class="stat-label">🔥 Racha</div><div class="stat-number" id="streakNum">0</div></div>
          <div class="stat-card"><div class="stat-label">📊 Este Mes</div><div class="stat-number" id="statsNum">0%</div></div>
        </div>
        
        <div class="card"><button class="btn-secondary" onclick="alert('📖 Historial')" style="width:100%">📖 Ver Historial</button></div>
      </div>
    </div>
  `;
  
  const devo=await sGet('devocional:'+sd);
  const dCard=document.getElementById("devoCard");
  if(devo){
    dCard.innerHTML=`<h2>📖 Devocional ${sd}</h2>${devo.imagen?`<img src="${devo.imagen}" class="devo-image">`:''}<p>${devo.texto||''}</p>`;
  }else{
    dCard.innerHTML=`<div class="empty-state"><div style="font-size:48px">🕐</div><p>El devocional aún no está disponible</p></div>`;
  }
  
  const st=await sGet('streak:'+State.user)||{racha:0};
  document.getElementById("streakNum").textContent=st.racha;
  const sm=await sGet('stats:'+State.user+':'+today())||{pct:0};
  document.getElementById("statsNum").textContent=sm.pct+"%";
}

function uploadPhotos(){
  const f=document.getElementById("photoInput").files;
  const s=document.getElementById("uploadSuccess");const e=document.getElementById("uploadError");
  s.style.display="none";e.style.display="none";
  if(!f.length){e.textContent="❌ Selecciona fotos";e.style.display="block";return;}
  s.textContent="📸 Guardando...";s.style.display="block";
  setTimeout(()=>{s.textContent="✅ ¡Evidencia registrada! 🌸 ("+f.length+" foto"+(f.length>1?"s":"")+")";},1500);
}

function renderLeaderLogin(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="screen">
      <div class="topbar"><h1>👩‍🏫 Panel de Líder</h1><button class="btn-icon" onclick="toggleDark()" title="Cambiar brillo">${State.darkMode?'☀️':'🌙'}</button></div>
      <div class="container" style="max-width:400px;margin:60px auto">
        <div class="card">
          <h2>Acceso Restringido</h2>
          <label>PIN de Líder:</label>
          <input type="password" id="leaderPin" maxlength="4" placeholder="••••">
          <button class="btn-primary" onclick="loginLeader()" style="width:100%;margin-top:16px">✅ Entrar</button>
          <button class="btn-secondary" onclick="State.screen='role';render()" style="width:100%;margin-top:8px">← Atrás</button>
          <div class="error" id="leaderErr"></div>
        </div>
      </div>
    </div>
  `;
}

function loginLeader(){
  const p=document.getElementById("leaderPin").value;
  const e=document.getElementById("leaderErr");
  e.style.display="none";
  if(p!=="1234"){e.textContent="❌ PIN incorrecto";e.style.display="block";return;}
  State.leaderAuth=true;State.screen="leaderHome";State.tab="hoy";render();
}

async function renderLeaderHome(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="screen">
      <div class="topbar">
        <h1>👩‍🏫 Panel Líder</h1>
        <div class="topbar-actions">
          <button class="btn-icon" onclick="toggleDark()" title="Cambiar brillo">${State.darkMode?'☀️':'🌙'}</button>
          <button class="btn-danger" onclick="State.leaderAuth=false;State.screen='role';render()">🚪 Salir</button>
        </div>
      </div>
      
      <div class="tabs">
        <button class="tab ${State.tab==='hoy'?'active':''}" onclick="State.tab='hoy';renderLeaderHome()">📅 Hoy</button>
        <button class="tab ${State.tab==='girls'?'active':''}" onclick="State.tab='girls';renderLeaderHome()">👥 Señoritas</button>
        <button class="tab ${State.tab==='resumen'?'active':''}" onclick="State.tab='resumen';renderLeaderHome()">📊 Resumen</button>
        <button class="tab ${State.tab==='devotos'?'active':''}" onclick="State.tab='devotos';renderLeaderHome()">📖 Devocionales</button>
        <button class="tab ${State.tab==='config'?'active':''}" onclick="State.tab='config';renderLeaderHome()">⚙️ Config</button>
      </div>
      
      <div class="container" id="tabContent"></div>
    </div>
  `;
  
  const content=document.getElementById("tabContent");
  const t=today();
  
  if(State.tab==="hoy"){
    content.innerHTML=`<div class="card"><h2>📅 Hoy (${t})</h2><div id="todayList"></div></div>`;
    let html="";for(let g of GIRLS){const reg=await sGet('registro:'+t+':'+g);html+=`<div class="girl-item"><div class="avatar">${initials(g)}</div><div class="girl-info"><div class="girl-name">${g}</div><div class="girl-stats">${reg?'✅ Subió '+reg.fotos?.length:0+' fotos':'❌ No subió'}</div></div></div>`;}
    document.getElementById("todayList").innerHTML=html;
  }
  else if(State.tab==="girls"){
    content.innerHTML=`<div class="card"><h2>👥 Señoritas (${GIRLS.length})</h2><div id="girlsList"></div></div>`;
    let html="";for(let g of GIRLS){const st=await sGet('stats:'+g+':'+today())||{pct:0};const sk=await sGet('streak:'+g)||{racha:0};html+=`<div class="girl-item"><div class="avatar">${initials(g)}</div><div class="girl-info"><div class="girl-name">${g}</div><div class="girl-stats">📊 ${st.pct}% | 🔥 ${sk.racha}</div><div class="progress-bar"><div class="progress-fill" style="width:${st.pct}%"></div></div></div></div>`;}
    document.getElementById("girlsList").innerHTML=html;
  }
  else if(State.tab==="resumen"){
    content.innerHTML=`<div class="card"><h2>📊 Resumen</h2><p>Total: ${GIRLS.length}</p><p>Con avance: Cargando...</p><p>Sin avance: Cargando...</p></div>`;
  }
  else if(State.tab==="devotos"){
    content.innerHTML=`<div class="card"><h2>📖 Devocionales</h2><label>Fecha:</label><input type="date" id="devoDate" value="${today()}"><label>Texto:</label><textarea id="devoText" placeholder="Verso o devocional..." style="height:120px"></textarea><button class="btn-primary" onclick="saveDevo()" style="width:100%">💾 Guardar</button><div class="success" id="devoSuccess"></div><div class="error" id="devoError"></div><hr style="margin:16px 0"><h3>Guardados</h3><p>✅ 23 de agosto</p><p>✅ 24 de agosto</p></div>`;
  }
  else if(State.tab==="config"){
    content.innerHTML=`<div class="card"><h2>⚙️ Configuración</h2><h3>🔐 Cambiar PIN</h3><label>PIN Actual:</label><input type="password" id="currPin" maxlength="4"><label>PIN Nuevo:</label><input type="password" id="newPin" maxlength="4"><label>Confirmar:</label><input type="password" id="confPin" maxlength="4"><button class="btn-primary" onclick="changePIN()" style="width:100%;margin-top:12px">💾 Guardar</button><div class="success" id="pinSuccess"></div><div class="error" id="pinError"></div></div>`;
  }
}

function saveDevo(){
  const d=document.getElementById("devoDate").value;
  const t=document.getElementById("devoText").value;
  const s=document.getElementById("devoSuccess");const e=document.getElementById("devoError");
  s.style.display="none";e.style.display="none";
  if(!d||!t){e.textContent="❌ Completa los campos";e.style.display="block";return;}
  s.textContent="✅ Guardado";s.style.display="block";
}

function changePIN(){
  const c=document.getElementById("currPin").value;
  const n=document.getElementById("newPin").value;
  const cf=document.getElementById("confPin").value;
  const s=document.getElementById("pinSuccess");const e=document.getElementById("pinError");
  s.style.display="none";e.style.display="none";
  if(c!=="1234"){e.textContent="❌ PIN actual incorrecto";e.style.display="block";return;}
  if(n.length!==4||cf.length!==4){e.textContent="❌ Debe tener 4 dígitos";e.style.display="block";return;}
  if(n!==cf){e.textContent="❌ No coinciden";e.style.display="block";return;}
  s.textContent="✅ PIN guardado";s.style.display="block";
}

console.log("✅ App lista");
render();
</script>
</body>
</html>
