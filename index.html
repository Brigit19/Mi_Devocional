<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Devocional • Casa Apostólica Belén</title>
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Mi%20Devocional%22,%22short_name%22:%22Mi%20Devocional%22,%22start_url%22:%22/%22,%22scope%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%2393547A%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%2393547A' rx='40'/><text x='96' y='130' font-size='140' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>🌸</text></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary-dark: #93547A;
      --primary: #B87BA6;
      --secondary: #EFB8D2;
      --accent: #D9B368;
      --success: #4CAF50;
      --danger: #F44336;
      --bg-main: #FDF5F8;
      --bg-secondary: #F5ECEF;
      --line: #E8D5E0;
      --ink: #4A3F47;
      --ink-soft: #8B7A84;
    }
    html, body { width: 100%; height: 100%; background: var(--bg-main); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    main { flex: 1; overflow-y: auto; padding: 16px; }
    .screen { display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--primary-dark); color: white; padding: 12px 16px; border-radius: 0 0 12px 12px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1)); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .brand-text { display: flex; flex-direction: column; font-weight: 600; } 
    .brand-text small { font-size: 12px; opacity: 0.8; font-weight: 400; }
    .icon-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .icon-btn:hover { background: rgba(255,255,255,0.3); }
    .tabs { display: flex; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; background: transparent; color: var(--ink-soft); border: 1px solid transparent; font-size: 14px; white-space: nowrap; }
    .tab.active { background: var(--primary-dark); color: white; }
    .card { background: white; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .seal { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 50%; width: 120px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; margin: 20px auto; }
    .seal.done { background: var(--success); }
    .section-title { margin: 20px 0 12px; }
    .section-title h2 { font-size: 20px; color: var(--primary-dark); }
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; margin: 8px 0; }
    button { padding: 12px 20px; background: var(--primary-dark); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .date-chip { display: inline-block; background: #FFF9E6; color: var(--accent); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; margin: 12px 0; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary-dark); color: white; padding: 14px 20px; border-radius: 8px; z-index: 1000; max-width: 90%; }
  </style>
</head>
<body>
<main id="main"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js"></script>
<script>
const APP_VERSION = "2026-08-24-LIMPIO-REPARADO";
const firebaseConfig = {
  apiKey: "AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",
  authDomain: "mi-devocional-663d3.firebaseapp.com",
  projectId: "mi-devocional-663d3",
  storageBucket: "mi-devocional-663d3.firebasestorage.app",
  messagingSenderId: "338063743895",
  appId: "1:338063743895:web:1578e6298f0d8b2b3982d2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const messaging = firebase.messaging();

const State = {
  screen: 'loading',
  names: [],
  config: {},
  currentUser: null,
  leaderAuthed: false,
  tab: 'hoy',
  filter: 'todas'
};

const DEFAULT_NAMES = [
  "Arianna Nicolle Rojas Camasca", "Danitza Belen Cordero Mercado", "Estefany Collazos", "Juana Huayanay Loayza", 
  "Lady Berrospi", "María Angela Vasquez Nolasco", "Marjorie Villalba Salazar", "Marisol Justiniano Tinoco", 
  "Marlú Milagros Escobar Salazar", "Sarai Tania Palomino", "Yorleni Collazos Castro", "Isabel Nancy Luna Vasquez", 
  "Katherin Yocelinda Meza Alanya", "Camila Rubino", "Erika Minaya Tolentino", "Belen Porras Blanco", 
  "Vania Noemi Canchanya Tinoco", "Yamile Mireya Inga Baldeon", "Nayra Stefania Gutierrez Flores", "Heidy Rojas Ahuanari", 
  "Zayuri Esteban Laura", "Thania Alegre Castillo", "Pamela Ines Carhuallanqui Obregón", "Maria Fernanda Tinoco Palacios", 
  "Valery Zulay Ipurre Escalera", "Ruth Keren Ramos Mayta", "Anny Karen Sotacuro Quicha", "Lucero Isidro Castro", 
  "Alcira Sanchez Quispe", "Andrea Jasmin Flores Santamaria", "Iyari Lazaro", "Marilyn Rosa Huayanay Torres", 
  "Very Luz Condezo Baltazar", "Anahi Anette Alvarez Collahuacho", "Laura Sanchez Quispe", "Nicole Huaranga Reyes"
];

const $ = id => document.getElementById(id) || document.querySelector(id);
const todayStr = () => new Date().toISOString().split('T')[0];
const fmtDateLong = d => new Date(d+'T00:00:00').toLocaleDateString('es-ES', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
const fmtDateShort = d => new Date(d+'T00:00:00').toLocaleDateString('es-ES', {month:'short', day:'numeric'});
const monthKey = d => d.substring(0, 7);
const addDaysToStr = (d, n) => new Date(new Date(d).getTime() + n*86400000).toISOString().split('T')[0];

const toast = msg => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
};

async function sGet(key) {
  try {
    const doc = await db.collection('datos').doc(key).get();
    return doc.exists ? doc.data() : null;
  } catch(e) { return null; }
}

async function sSet(key, data) {
  try {
    await db.collection('datos').doc(key).set(data);
  } catch(e) { console.error(e); }
}

async function init() {
  State.names = DEFAULT_NAMES;
  State.config = await sGet('config') || { leaderPin: '1234' };
  render('role');
}

function render(screen) {
  State.screen = screen;
  const main = $('main');
  
  if(screen === 'role') {
    main.innerHTML = `
      <div class="screen" style="justify-content:center;align-items:center;">
        <div style="text-align:center;">
          <div style="font-size:60px;margin:20px;">🌸</div>
          <h1 style="color:var(--primary-dark);margin:20px 0;">Mi Devocional</h1>
          <p style="color:var(--ink-soft);margin:20px 0;">Casa Apostólica Belén</p>
          <button onclick="render('girlLogin')" style="margin:10px;min-width:200px;">👧 Señorita</button>
          <button onclick="render('leaderLogin')" style="margin:10px;min-width:200px;">👩‍🏫 Líder</button>
        </div>
      </div>
    `;
  }
  
  if(screen === 'girlLogin') {
    main.innerHTML = `
      <div class="screen">
        <div class="topbar"><button onclick="render('role')" class="icon-btn">← Atrás</button></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;">
          <h2 style="color:var(--primary-dark);margin-bottom:20px;">👧 Ingresa tu nombre</h2>
          <select id="nameSelect" style="width:100%;max-width:300px;padding:12px;margin:10px 0;font-size:16px;">
            <option value="">-- Selecciona tu nombre --</option>
            ${State.names.map(n => `<option value="${n}">${n}</option>`).join('')}
          </select>
          <input id="girlPin" type="password" placeholder="PIN: 0000" maxlength="4" style="width:100%;max-width:300px;">
          <button onclick="loginGirl()" style="width:100%;max-width:300px;margin-top:20px;">Entrar</button>
          <div id="girlErr" style="color:var(--danger);margin-top:10px;display:none;">❌ Nombre o PIN incorrecto</div>
        </div>
      </div>
    `;
  }
  
  if(screen === 'leaderLogin') {
    main.innerHTML = `
      <div class="screen">
        <div class="topbar"><button onclick="render('role')" class="icon-btn">← Atrás</button></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;">
          <h2 style="color:var(--primary-dark);margin-bottom:20px;">👩‍🏫 PIN de Líder</h2>
          <input id="leaderPin" type="password" placeholder="Ingresa tu PIN" maxlength="4" style="width:100%;max-width:300px;padding:12px;margin:10px 0;font-size:20px;text-align:center;" onkeypress="if(event.key==='Enter') loginLeader()">
          <button onclick="loginLeader()" style="width:100%;max-width:300px;margin-top:20px;">Entrar</button>
          <div id="leaderErr" style="color:var(--danger);margin-top:10px;display:none;">❌ PIN incorrecto</div>
        </div>
      </div>
    `;
  }
  
  if(screen === 'girlHome') {
    renderGirlHome();
  }
  
  if(screen === 'leaderHome') {
    renderLeaderHome();
  }
}

function loginGirl() {
  const name = $('#nameSelect').value;
  const pin = $('#girlPin').value;
  const err = $('#girlErr');
  
  if(!name || pin !== '0000') {
    err.style.display = 'block';
    return;
  }
  
  State.currentUser = { nombre: name, id: name.replace(/\s+/g, '_').toLowerCase() };
  render('girlHome');
}

function loginLeader() {
  const pin = $('#leaderPin').value;
  const err = $('#leaderErr');
  
  if(pin !== State.config.leaderPin) {
    err.style.display = 'block';
    return;
  }
  
  State.leaderAuthed = true;
  render('leaderHome');
}

async function renderGirlHome() {
  const main = $('main');
  const today = todayStr();
  const selectedDate = sessionStorage.getItem('selectedDate') || today;
  const user = State.currentUser;
  
  const devo = await sGet('devocional:' + selectedDate);
  const regKey = 'registro:' + selectedDate + ':' + user.id;
  const registro = await sGet(regKey);
  
  main.innerHTML = `
    <div class="screen">
      <div class="topbar" style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:600;">Mi Devocional</div>
        <div style="display:flex;gap:8px;">
          <button onclick="switchDay(-1)" style="background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:6px;border:none;color:white;cursor:pointer;font-size:12px;">Ayer</button>
          <button onclick="switchDay(0)" style="background:rgba(255,255,255,0.4);padding:6px 12px;border-radius:6px;border:none;color:white;cursor:pointer;font-size:12px;">Hoy</button>
        </div>
      </div>
      <main>
        <div class="date-chip">${fmtDateLong(selectedDate)}</div>
        ${devo ? `<div class="card"><img src="${devo.imagen}" style="width:100%;border-radius:8px;margin-bottom:12px;"><p>${devo.texto || ''}</p></div>` : '<div class="card">📭 Devocional no publicado</div>'}
        ${devo ? `<button id="uploadBtn" onclick="document.getElementById('fileInput').click()" style="width:100%;">📸 Subir evidencia</button>` : ''}
        <input id="fileInput" type="file" accept="image/*" multiple style="display:none;">
      </main>
    </div>
  `;
  
  const btn = $('uploadBtn');
  if(btn) {
    $('fileInput').onchange = async (e) => {
      try {
        btn.textContent = '📸 Guardando...';
        btn.disabled = true;
        const files = Array.from(e.target.files).slice(0, 5);
        const fotos = [];
        for(const f of files) fotos.push(await compressImage(f, 700, 0.6));
        const reg = { estado: 'M', fotos, hora: new Date().toISOString() };
        await sSet(regKey, reg);
        toast('✅ ¡Devocional registrado! 🌸');
        setTimeout(() => renderGirlHome(), 1500);
      } catch(err) {
        toast('❌ Error al subir');
        btn.disabled = false;
        btn.textContent = '📸 Subir evidencia';
      }
    };
  }
  
  $('main').innerHTML += '<button onclick="render(\'role\')" style="width:100%;margin-top:20px;background:var(--danger);">🚪 Salir</button>';
}

function switchDay(offset) {
  const today = todayStr();
  const newDate = addDaysToStr(today, offset);
  sessionStorage.setItem('selectedDate', newDate);
  renderGirlHome();
}

async function renderLeaderHome() {
  const main = $('main');
  main.innerHTML = `
    <div class="screen">
      <div class="topbar" style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:600;">Panel Líder</div>
        <button onclick="State.leaderAuthed=false;render('role');" class="icon-btn">🚪 Salir</button>
      </div>
      <div class="tabs">
        <div class="tab active" onclick="State.tab='hoy';paintTabs();renderTab();">Hoy</div>
        <div class="tab" onclick="State.tab='senoritas';paintTabs();renderTab();">Señoritas</div>
        <div class="tab" onclick="State.tab='config';paintTabs();renderTab();">⚙️ Config</div>
      </div>
      <div id="tabBody"></div>
    </div>
  `;
  paintTabs();
  renderTab();
}

function paintTabs() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.includes(State.tab)));
}

function renderTab() {
  const body = $('tabBody');
  
  if(State.tab === 'hoy') {
    body.innerHTML = '<div class="section-title"><h2>📊 Hoy</h2></div><div class="card">📱 Vista del día actual</div>';
  }
  else if(State.tab === 'senoritas') {
    body.innerHTML = '<div class="section-title"><h2>👧 Señoritas ('+ State.names.length +')</h2></div>' + 
      State.names.map(n => '<div class="card" style="padding:12px;">' + n + '</div>').join('');
  }
  else if(State.tab === 'config') {
    renderTabConfig();
  }
}

async function renderTabConfig() {
  const body = $('tabBody');
  body.innerHTML = `
    <div class="section-title"><h2>⚙️ Configuración</h2></div>
    <div class="card">
      <h3 style="margin-bottom:12px;">🔐 Cambiar PIN</h3>
      <input id="currentPin" type="password" placeholder="PIN actual">
      <input id="newPin" type="password" placeholder="PIN nuevo (4 dígitos)" maxlength="4">
      <input id="confirmPin" type="password" placeholder="Confirmar PIN" maxlength="4">
      <div id="configErr" style="color:var(--danger);margin:10px 0;display:none;"></div>
      <div id="configOk" style="color:var(--success);margin:10px 0;display:none;"></div>
      <button onclick="changePin()" style="width:100%;">💾 Guardar PIN</button>
    </div>
  `;
}

async function changePin() {
  const current = $('#currentPin').value.trim();
  const newPin = $('#newPin').value.trim();
  const confirm = $('#confirmPin').value.trim();
  const err = $('#configErr');
  const ok = $('#configOk');
  
  err.style.display = 'none';
  ok.style.display = 'none';
  
  if(current !== State.config.leaderPin) {
    err.textContent = '❌ PIN actual incorrecto';
    err.style.display = 'block';
    return;
  }
  
  if(newPin.length !== 4 || isNaN(newPin)) {
    err.textContent = '❌ PIN debe tener 4 dígitos';
    err.style.display = 'block';
    return;
  }
  
  if(newPin !== confirm) {
    err.textContent = '❌ Los PINs no coinciden';
    err.style.display = 'block';
    return;
  }
  
  State.config.leaderPin = newPin;
  await sSet('config', State.config);
  ok.textContent = '✅ PIN cambiado: ' + newPin;
  ok.style.display = 'block';
}

async function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, maxWidth / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

setTimeout(() => init(), 100);
</script>
</body>
</html>
