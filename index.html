<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Devocional</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #FDF5F8;
      --bg-card: #FFFFFF;
      --primary-dark: #93547A;
      --fuchsia: #EFB8D2;
      --gold: #D9B368;
      --gold-soft: #FCEEDD;
      --success: #5E9A78;
      --danger: #C97676;
      --line: #F3E1EB;
      --ink: #333333;
      --ink-soft: #999999;
      --shadow: #00000010;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    #app { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 40px; }
    main { padding: 16px; }
    .screen { min-height: 100vh; position: relative; }
    .topbar {
      background: var(--primary-dark);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-radius: 0 0 12px 12px;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 14px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-dark), #a85f8f);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(147, 84, 122, 0.3); }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .logout-btn {
      background: linear-gradient(135deg, #c97676, #d97676);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .logout-btn:hover { box-shadow: 0 4px 12px rgba(201, 118, 118, 0.5); }
    .date-chip {
      display: inline-block;
      background: var(--gold-soft);
      padding: 12px 24px;
      border-radius: 24px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      color: var(--primary-dark);
      font-size: 14px;
      width: 100%;
    }
    .devo-card {
      background: var(--bg-card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .devo-card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .devo-text {
      margin: 0;
      color: var(--ink);
      line-height: 1.5;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="screen">
    <div class="topbar">
      <div style="color: white; font-weight: 600;">Mi Devocional</div>
      <button class="logout-btn">🚪 Salir</button>
    </div>
    <main id="main">
      <div style="text-align: center; padding: 60px 20px; color: var(--ink-soft);">
        <p style="font-size: 18px; font-weight: 600;">Cargando...</p>
        <p>Por favor espera un momento ⏳</p>
      </div>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",
  authDomain: "mi-devocional-663d3.firebaseapp.com",
  projectId: "mi-devocional-663d3",
  storageBucket: "mi-devocional-663d3.firebasestorage.app",
  messagingSenderId: "338063743895",
  appId: "1:338063743895:web:1578e6298f0d8b2b3982d2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Variables globales
const State = {};

async function sGet(key) {
  try {
    const doc = await db.collection('app').doc(key).get();
    return doc.data();
  } catch(e) {
    console.error('Error reading:', key, e);
    return null;
  }
}

async function sSet(key, value) {
  try {
    await db.collection('app').doc(key).set(value);
    return true;
  } catch(e) {
    console.error('Error writing:', key, e);
    return false;
  }
}

function toast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: var(--primary-dark); color: white; padding: 12px 24px;
    border-radius: 24px; font-size: 14px; z-index: 1000;
    animation: slideUp 0.3s ease;
  `;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function init() {
  try {
    const main = document.getElementById('main');
    
    // Pantalla de Login
    main.innerHTML = `
      <div style="text-align: center; padding: 60px 20px;">
        <h1 style="color: var(--primary-dark); margin-bottom: 40px;">Mi Devocional</h1>
        
        <div class="card">
          <p style="margin-top: 0; color: var(--ink-soft);">¿Quién eres?</p>
          
          <button class="btn btn-primary" style="width: 100%; margin-bottom: 12px;">
            👧 Soy Señorita
          </button>
          
          <button class="btn btn-primary" style="width: 100%;">
            👩‍💼 Soy Lideresa
          </button>
        </div>
        
        <p style="color: var(--ink-soft); font-size: 12px; margin-top: 20px;">
          Cargando aplicación...
        </p>
      </div>
    `;
    
    toast('✅ App lista');
    
  } catch(error) {
    console.error('Error en init:', error);
    document.getElementById('main').innerHTML = `
      <div style="text-align: center; padding: 40px;">
        <p style="color: var(--danger);">❌ Error al cargar</p>
        <p style="color: var(--ink-soft); font-size: 12px;">${error.message}</p>
      </div>
    `;
  }
}

// Llamar init cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('load', init);

// También llamar directamente
setTimeout(init, 100);
</script>

</body>
</html>
