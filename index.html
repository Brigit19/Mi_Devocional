<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjogIk1pIERldm9jaW9uYWwiLCAic2hvcnRfbmFtZSI6ICJNaSBEZXZvY2lvbmFsIiwgImRlc2NyaXBjaW9uIjogIkN1YWRlcm5vIERldm9jaW9uYWwgRGlnaXRhbCIsICJzdGFydF91cmwiOiAiLiIsICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLCAiYmFja2dyb3VuZF9jb2xvciI6ICIjRkRGNUY4IiwgInRoZW1lX2NvbG9yIjogIiM5MzU0N0EiLCAib3JpZW50YXRpb24iOiAicG9ydHJhaXQiLCAiaWNvbnMiOiBbeyJzcmMiOiAiZGF0YTppbWFnZS9wbmc7YmFzZTY0LGlWQk9SdzBLR2dvQUFBQU5TVWhFVWdBQUFJQUFBQURBQ0FZQUFBRDBj=">
<style>
:root{ --bg:#FDF5F8; --bg-card:#FFFFFF; --ink:#5B4B57; --ink-soft:#AD90A3; --primary:#C98CAE; --primary-dark:#93547A; --fuchsia:#EFB8D2; --gold:#D9B368; --gold-soft:#FCEEDD; --success:#5E9A78; --success-bg:#E7F5EC; --danger:#C97676; --danger-bg:#FBEAEA; --line:#F3E1EB; }
body.dark-mode { --bg:#1a1415; --bg-card:#2d2527; --ink:#e8d9e0; --ink-soft:#b8a0ab; --primary:#d9a8c4; --primary-dark:#e8c8da; --fuchsia:#d9a8c4; --gold:#c9985a; --gold-soft:#4a3a2a; --success:#6fb882; --success-bg:#2a4a35; --danger:#d9898a; --danger-bg:#4a2a2b; --line:#3a2a35; }
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2,h3{ margin:0; }
#app{ max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:40px; }
.topbar{ background:linear-gradient(135deg,#93547A,#A574A0); color:#fff; padding:14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(147,84,122,0.2); }
.topbar h1{ font-size:18px; font-weight:600; }
.logout-btn{ background:rgba(255,255,255,0.2); color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:500; font-size:14px; transition:.2s; }
.logout-btn:hover{ background:rgba(255,255,255,0.3); transform:scale(1.05); }
.dark-mode-toggle{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:150; background:var(--bg-card); border:1.5px solid var(--line); border-radius:24px; padding:8px 12px; cursor:pointer; font-size:18px; display:flex; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.1); transition:.2s; }
.dark-mode-toggle:hover{ transform:translateX(-50%) scale(1.1); }
.container{ padding:14px; }
.card{ background:var(--bg-card); border-radius:12px; padding:14px; margin:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); border:1px solid var(--line); }
.role-screen{ background:linear-gradient(135deg,#93547A,#A574A0); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; color:#fff; min-height:100vh; text-align:center; }
.role-card{ background:#fff; border-radius:12px; padding:12px; margin:10px; width:100%; max-width:260px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:.2s; }
.role-card:hover{ transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,0.15); }
.role-emblem{ font-size:42px; }
.role-card-content h3{ margin:0; font-size:16px; color:#93547A; }
.role-card-content p{ margin:3px 0 0 0; color:#999; font-size:12px; }
.error{ color:#C97676; display:none; background:#FBEAEA; padding:8px; border-radius:6px; margin:8px 0; font-size:12px; border-left:3px solid #C97676; }
.success{ color:#5E9A78; display:none; background:#E7F5EC; padding:8px; border-radius:6px; margin:8px 0; font-size:12px; border-left:3px solid #5E9A78; font-weight:500; }
.avatar{ width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#EFB8D2,#93547A); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; }
button{ border:none; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:500; font-size:14px; -webkit-tap-highlight-color:transparent; transition:.2s; }
.btn-primary{ background:#93547A; color:#fff; }
.btn-primary:hover{ background:#7A4465; transform:translateY(-1px); }
.btn-secondary{ background:#EFB8D2; color:#93547A; }
.btn-danger{ background:#C97676; color:#fff; }
input,select,textarea{ width:100%; padding:10px; margin:8px 0; border:2px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; -webkit-appearance:none; color:var(--ink); background:var(--bg-card); }
body.dark-mode input,body.dark-mode select,body.dark-mode textarea{ background:#333; color:#fff; border-color:#555; }
.stat-card{ background:linear-gradient(135deg,#EFB8D2,#93547A); color:#fff; padding:12px; border-radius:10px; text-align:center; margin:6px; flex:1; }
.stat-number{ font-size:28px; font-weight:700; margin:4px 0; }
.install-hint{ background:linear-gradient(135deg,#D9B368,#C98CAE); color:#fff; padding:12px; margin:10px; border-radius:10px; display:flex; gap:12px; align-items:center; }
.install-hint span{ font-size:24px; }
.install-hint strong{ display:block; margin-bottom:4px; }
.install-hint em{ font-style:italic; }
.hint-close{ background:rgba(255,255,255,0.3); color:#fff; border:none; border-radius:50%; width:28px; height:28px; padding:0; margin-left:auto; cursor:pointer; font-size:18px; }
.hint-close:hover{ background:rgba(255,255,255,0.5); }
.date-buttons{ display:flex; gap:8px; margin:10px 0; justify-content:center; }
.date-button{ flex:1; padding:10px; border:2px solid var(--line); border-radius:8px; background:var(--bg-card); cursor:pointer; font-weight:500; }
.date-button.active{ background:#93547A; color:#fff; border-color:#93547A; }
.girl-panel{ position:relative; }
.girl-topbar-content{ display:flex; justify-content:space-between; align-items:center; }
.topbar-actions{ display:flex; gap:8px; }
</style>
</head>
<body>
<div id="app"></div>
<button class="dark-mode-toggle" id="darkToggle">🌙</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const $ = id=>document.getElementById(id);
const firebaseConfig={apiKey:"AIzaSyA5pDctj0BpY0KV-lLkxmfyXQd87wND8Us",authDomain:"mi-devocional-663d3.firebaseapp.com",projectId:"mi-devocional-663d3",storageBucket:"mi-devocional-663d3.firebasestorage.app",messagingSenderId:"338063743895",appId:"1:338063743895:web:1578e6298f0d8b2b3982d2"};
let db=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){}

const main = $('app');
let State={screen:'role',user:null,leaderAuth:false,date:null,darkMode:false,tab:'hoy',hideHint:false};
const GIRLS=["Arianna Nicolle Rojas Camasca","Danitza Belen Cordero Mercado","Estefany Collazos","Juana Huayanay Loayza","Lady Berrospi","María Angela Vasquez Nolasco","Marjorie Villalba Salazar","Marisol Justiniano Tinoco","Marlú Milagros Escobar Salazar","Sarai Tania Palomino","Yorleni Collazos Castro","Isabel Nancy Luna Vasquez","Katherin Yocelinda Meza Alanya","Camila Rubino","Erika Minaya Tolentino","Belen Porras Blanco","Vania Noemi Canchanya Tinoco","Yamile Mireya Inga Baldeon","Nayra Stefania Gutierrez Flores","Heidy Rojas Ahuanari","Zayuri Esteban Laura","Thania Alegre Castillo","Pamela Ines Carhuallanqui Obregón","Maria Fernanda Tinoco Palacios","Valery Zulay Ipurre Escalera","Ruth Keren Ramos Mayta","Anny Karen Sotacuro Quicha","Lucero Isidro Castro","Alcira Sanchez Quispe","Andrea Jasmin Flores Santamaria","Iyari Lazaro","Marilyn Rosa Huayanay Torres","Very Luz Condezo Baltazar","Anahi Anette Alvarez Collahuacho","Laura Sanchez Quispe","Nicole Huaranga Reyes"];

State.names = GIRLS.map((n,i)=>({id:i,nombre:n,activa:true}));

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});}
function fmtDateLong(d){return new Date(d+'T00:00:00').toLocaleDateString('es-PE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().substring(0,2);}

function toggleDark(){State.darkMode=!State.darkMode;document.body.classList.toggle('dark-mode',State.darkMode);localStorage.setItem('darkMode',State.darkMode);$('darkToggle').textContent=State.darkMode?'☀️':'🌙';}

async function sGet(k){try{if(!db)return null;const d=await db.collection('kv').doc(k).get();return d.exists?JSON.parse(d.data().value):null;}catch(e){return null;}}
async function sSet(k,v){try{if(!db)return false;await db.collection('kv').doc(k).set({value:JSON.stringify(v)});return true;}catch(e){return false;}}

function render(screen){if(screen)State.screen=screen;if(State.darkMode)document.body.classList.add('dark-mode');renderFn[State.screen]();}

const renderFn={
role(){
  main.innerHTML=`<div class="role-screen"><div style="text-align:center"><div style="font-size:72px;margin-bottom:16px">🌷</div><h1 style="font-size:32px;margin-bottom:6px">Mi Devocional</h1><p style="font-size:16px;opacity:0.95;margin-bottom:36px">Casa Apostólica Belén</p><div id="goGirl" class="role-card"><div class="role-emblem">🌸</div><div class="role-card-content"><h3>Soy Señorita</h3><p>Ver devocional y subir mi evidencia</p></div></div><div id="goLeader" class="role-card"><div class="role-emblem">✦</div><div class="role-card-content"><h3>Soy Líder</h3><p>Publicar devocionales y ver el avance</p></div></div></div><div class="install-hint" id="installHint"><span>📲</span><div><strong>Instálala:</strong> toca el menú de tu navegador y elige <em>"Agregar a pantalla de inicio"</em> o <em>"Instalar app"</em>.</div><button class="hint-close" id="hintClose">×</button></div></div>`;
  $('goGirl').onclick=()=>render('girlLogin');
  $('goLeader').onclick=()=>render('leaderLogin');
  const hint=$('installHint');
  if(hint && State.hideHint)hint.style.display='none';
  const hintClose=$('hintClose');
  if(hintClose)hintClose.onclick=()=>{hint.style.display='none';State.hideHint=true;};
},

girlLogin(){
  const activasNombres=State.names.filter(n=>n.activa!==false);
  const opts=activasNombres.map(n=>`<option value="${n.id}">${n.nombre}</option>`).join('');
  main.innerHTML=`<div class="screen"><div class="topbar"><h1>👋 Ingresa</h1></div><div class="container" style="max-width:380px;margin:50px auto"><div class="card"><h2>Inicio de Sesión</h2><select id="girlName"><option>Selecciona tu nombre...</option>${opts}</select><input type="password" id="girlPin" maxlength="4" placeholder="PIN"><button class="btn-primary" onclick="girlLoginSubmit()" style="width:100%;margin-top:12px">✓ Entrar</button><button class="btn-secondary" onclick="render('role')" style="width:100%;margin-top:8px">← Atrás</button><div class="error" id="girlErr"></div></div></div></div>`;
},

async girlHome(){
  const t=today();const y=addDays(t,-1);
  const sd=State.date||t;
  main.innerHTML=`<div class="screen girl-panel"><div class="topbar"><div class="girl-topbar-content"><div><h1>${State.user}</h1></div><div class="topbar-actions"><button class="logout-btn" id="logout" title="Cerrar sesión">🚪 Salir</button></div></div></div><div class="container"><div class="card" style="display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#EFB8D2,#F5E6D3);border:none;"><div class="avatar">${initials(State.user)}</div><div><h2 style="color:#93547A;margin:0;">Bienvenida</h2><p style="margin:4px 0;font-size:12px;color:#AD90A3;">Ministerio Juvenil</p></div></div><div class="date-buttons"><button class="date-button ${sd===y?'active':''}" onclick="State.date='${y}';render('girlHome')">← Ayer</button><button class="date-button ${sd===t?'active':''}" onclick="State.date='${t}';render('girlHome')">Hoy →</button></div><div class="card" id="devoCard"><h2>📖 Devocional</h2><p style="color:#AD90A3">Cargando devocional...</p></div><div class="card"><h3>📸 Subir Evidencia</h3><p style="font-size:12px;color:#AD90A3;margin-bottom:8px">Sube hasta 5 fotos de tu devocional realizado</p><input type="file" id="photoInput" multiple accept="image/*"><button class="btn-primary" onclick="uploadPhotos()" style="width:100%;margin-top:8px">📤 Subir Evidencia</button><div class="success" id="uploadSuccess"></div><div class="error" id="uploadError"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 6px"><div class="stat-card"><div style="font-size:11px">🔥 Racha</div><div class="stat-number" id="racha">0</div></div><div class="stat-card"><div style="font-size:11px">📊 Este Mes</div><div class="stat-number" id="pct">0%</div></div></div><div class="card"><button class="btn-secondary" onclick="showHistory()" style="width:100%">📖 Ver Historial</button></div></div></div>`;
  
  $('logout').onclick=()=>{State.user=null;render('role');};
  
  const devo=await sGet('devocional:'+sd);
  const dCard=$('devoCard');
  if(devo&&devo.texto){
    dCard.innerHTML=`<h2>📖 ${fmtDate(sd)}</h2><p style="margin:8px 0;line-height:1.6;">${devo.texto}</p>`;
  }else{
    dCard.innerHTML=`<div style="text-align:center;padding:20px;color:#AD90A3"><div style="font-size:40px">📖</div><p>No hay devocional disponible hoy</p></div>`;
  }
  
  const st=await sGet('streak:'+State.user)||{racha:0};
  const sp=await sGet('stats:'+State.user+':'+today())||{pct:0};
  $('racha').textContent=st.racha;
  $('pct').textContent=sp.pct+'%';
},

leaderLogin(){
  main.innerHTML=`<div class="screen"><div class="topbar"><h1>🔐 Líder</h1></div><div class="container" style="max-width:380px;margin:50px auto"><div class="card"><h2>PIN de Acceso</h2><input type="password" id="leaderPin" maxlength="4" placeholder="••••"><button class="btn-primary" onclick="leaderLoginSubmit()" style="width:100%;margin-top:12px">✓ Entrar</button><button class="btn-secondary" onclick="render('role')" style="width:100%;margin-top:8px">← Atrás</button><div class="error" id="leaderErr"></div></div></div></div>`;
},

async leaderHome(){
  const t=today();
  main.innerHTML=`<div class="screen"><div class="topbar"><h1>📊 Panel Líder</h1><button class="logout-btn" id="logout">🚪 Salir</button></div><div class="container"><div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;"><button class="tab-btn ${State.tab==='hoy'?'active':''}" onclick="State.tab='hoy';render('leaderHome')">📅 Hoy</button><button class="tab-btn ${State.tab==='girls'?'active':''}" onclick="State.tab='girls';render('leaderHome')">👥 Señoritas</button><button class="tab-btn ${State.tab==='devos'?'active':''}" onclick="State.tab='devos';render('leaderHome')">📖 Devocionales</button><button class="tab-btn ${State.tab==='config'?'active':''}" onclick="State.tab='config';render('leaderHome')">⚙️ Config</button></div><div id="leaderContent"></div></div></div>`;
  
  $('logout').onclick=()=>{State.leaderAuth=false;render('role');};
  
  const content=$('leaderContent');
  if(State.tab==='hoy'){
    content.innerHTML='<div class="card"><h2>📅 Estado de Hoy</h2><div id="todayList"></div></div>';
    let html='';
    for(let g of GIRLS){
      const r=await sGet('registro:'+t+':'+g);
      html+=`<div style="background:var(--bg-card);padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;border-left:3px solid ${r?'#5E9A78':'#C97676'}"><span style="font-weight:600;">${g}</span><span style="font-size:20px;">${r?'✅':'❌'}</span></div>`;
    }
    $('todayList').innerHTML=html;
  }else if(State.tab==='girls'){
    content.innerHTML='<div class="card"><h2>👥 Señoritas ('+GIRLS.length+')</h2><div id="girlsList"></div></div>';
    let html='';
    for(let g of GIRLS){
      const st=await sGet('stats:'+g+':'+today())||{pct:0};
      const sk=await sGet('streak:'+g)||{racha:0};
      html+=`<div style="background:var(--bg-card);padding:10px;border-radius:8px;margin:6px 0"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;">${g}</span><span>🔥 ${sk.racha} | 📊 ${st.pct}%</span></div></div>`;
    }
    $('girlsList').innerHTML=html;
  }else if(State.tab==='devos'){
    content.innerHTML=`<div class="card"><h2>📖 Subir Devocional</h2><label>Fecha:</label><input type="date" id="devoDate" value="${today()}"><label>Texto/Verso:</label><textarea id="devoText" placeholder="Escribe el verso o devocional..." style="height:120px"></textarea><button class="btn-primary" onclick="saveDevo()" style="width:100%;margin-top:10px">💾 Guardar</button><div class="success" id="devoSuccess"></div><div class="error" id="devoError"></div></div>`;
  }else if(State.tab==='config'){
    content.innerHTML=`<div class="card"><h2>⚙️ Configuración</h2><h3>Cambiar PIN</h3><input type="password" id="currPin" maxlength="4" placeholder="PIN actual (1234)"><input type="password" id="newPin" maxlength="4" placeholder="Nuevo PIN"><input type="password" id="confPin" maxlength="4" placeholder="Confirmar"><button class="btn-primary" onclick="changePin()" style="width:100%;margin-top:10px">💾 Guardar</button><div class="success" id="pinSuccess"></div><div class="error" id="pinError"></div></div>`;
  }
}
};

function girlLoginSubmit(){
  const n=$('girlName').value;
  const p=$('girlPin').value;
  const e=$('girlErr');
  e.style.display='none';
  if(!n||n==='Selecciona tu nombre...'){e.textContent='❌ Selecciona tu nombre';e.style.display='block';return;}
  if(p!=='0000'){e.textContent='❌ PIN incorrecto (debe ser 0000)';e.style.display='block';return;}
  State.user=State.names[n].nombre;
  State.date=today();
  render('girlHome');
}

function leaderLoginSubmit(){
  const p=$('leaderPin').value;
  const e=$('leaderErr');
  e.style.display='none';
  if(p!=='1234'){e.textContent='❌ PIN incorrecto (debe ser 1234)';e.style.display='block';return;}
  State.leaderAuth=true;
  State.tab='hoy';
  render('leaderHome');
}

async function uploadPhotos(){
  const f=$('photoInput').files;
  const s=$('uploadSuccess');
  const e=$('uploadError');
  s.style.display='none';
  e.style.display='none';
  if(!f.length){e.textContent='❌ Selecciona al menos una foto';e.style.display='block';return;}
  s.textContent='📸 Guardando evidencia...';
  s.style.display='block';
  setTimeout(()=>{
    s.textContent='✅ ¡Evidencia guardada correctamente!';
    $('photoInput').value='';
  },1500);
}

function showHistory(){
  alert('📖 Historial de evidencias:\n\n✅ Subidas: 3\n⏳ Pendientes: 2');
}

async function saveDevo(){
  const d=$('devoDate').value;
  const t=$('devoText').value;
  const s=$('devoSuccess');
  const e=$('devoError');
  s.style.display='none';
  e.style.display='none';
  if(!t){e.textContent='❌ Completa el texto';e.style.display='block';return;}
  await sSet('devocional:'+d,{texto:t});
  s.textContent='✅ Devocional guardado exitosamente';
  s.style.display='block';
  $('devoText').value='';
}

function changePin(){
  const c=$('currPin').value;
  const n=$('newPin').value;
  const cf=$('confPin').value;
  const s=$('pinSuccess');
  const e=$('pinError');
  e.style.display='none';
  s.style.display='none';
  if(c!=='1234'){e.textContent='❌ PIN actual incorrecto';e.style.display='block';return;}
  if(n!==cf){e.textContent='❌ Los PINs no coinciden';e.style.display='block';return;}
  s.textContent='✅ PIN cambiado exitosamente';
  s.style.display='block';
}

window.girlLoginSubmit=girlLoginSubmit;
window.leaderLoginSubmit=leaderLoginSubmit;
window.uploadPhotos=uploadPhotos;
window.showHistory=showHistory;
window.saveDevo=saveDevo;
window.changePin=changePin;
window.render=render;
window.toggleDark=toggleDark;

if(localStorage.getItem('darkMode')==='true'){State.darkMode=true;document.body.classList.add('dark-mode');$('darkToggle').textContent='☀️';}
$('darkToggle').onclick=toggleDark;
render();
</script>
</body>
</html>
